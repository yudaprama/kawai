[package]
name = "pdf"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rig = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process"] }

[dev-dependencies]
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn" }
