[package]
name = "officecreate"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rig = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn" }
