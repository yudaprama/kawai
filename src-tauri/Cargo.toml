[package]
name = "kawai"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "kawai"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kawai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# OS-native credential storage for the session JWT (Keychain/Keystore).
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync"] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
tokio-util = "0.7"
# Matches the graph majority (hf-hub / tokenizers / jigsawstack run 0.9).
rand = "0.9"

# Web-only deps (gated behind the `web` feature). Excluded entirely from
# desktop/mobile builds.
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", optional = true, features = ["fs"] }
# High-level streaming chat over LiteRT-LM (on-device Gemma 4, etc.).
# Pulls in cognee-litert-lm transitively. Gated behind `litert`.
local-llm = { path = "../local-llm", optional = true }
# Phase-1/2/3 extracted crates (pure, no transport). Re-exported via
# `src/auth.rs`, `src/logic/remote.rs`, `src/logic/db.rs`/`db_migrations.rs`,
# `src/logic/skills.rs`/`memory.rs`, `src/logic/office` shims so
# `crate::auth::*` and `crate::logic::*` remain stable.
kawai-auth = { path = "../crates/foundation/auth" }
kawai-billing = { path = "../crates/foundation/billing" }
remote-llm = { path = "../crates/foundation/remote-llm" }
kawai-db = { path = "../crates/foundation/db" }
kawai-paths = { path = "../crates/foundation/paths" }
kawai-skills = { path = "../crates/foundation/skills" }
kawai-memory = { path = "../crates/foundation/memory" }
kawai-tool-catalog = { path = "../crates/foundation/tool-catalog" }
kawai-office = { path = "../crates/engines/office", features = ["paddle-ocr"] }
kawai-knowledge = { path = "../crates/engines/knowledge", features = ["office", "graph"] }
kawai-analytics = { path = "../crates/toolsets/analytics-tools" }
kawai-email = { path = "../crates/integrations/email" }
# Local email+password auth — email-as-identity user directory + Session type.
# Polars-backed data analysis engine; used by the analytics tools + `sql_remote_check` example.
analytics = { path = "../crates/engines/analytics" }
kawai-agent = { path = "../crates/engines/agent", features = ["office", "webread", "graph", "analytics"] }
codegraph = { path = "../crates/toolsets/codegraph", optional = true }
kawai-agent-contract = { path = "../crates/foundation/agent-contract" }
# The agent tool seam (tool trait + registry) shared with components.
kawai-tools = { path = "../kawai-tools" }
# Auto-routing: rule-based agent selection for auto mode.
kawai-router = { path = "../crates/router", optional = true }
# default-features=false keeps only the local-SQLite core: replication/remote
# would pull tonic 0.11 + hyper 0.14 + axum 0.6 + rustls 0.22 (dead weight —
# every call site uses Builder::new_local; re-add "remote" with sqld sync).
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
jsonwebtoken = "9"
# rustls (not default features) keeps the TLS stack aligned with libsql
# and compiles for android arm64 + ios arm64. Used only for JWKS fetch in auth.rs.
# 0.13 matches kawai-embedding/youtube_transcript — one reqwest in the graph.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
# Loads KAWAI_AUTH_* from the project-root .env in dev (no-op if absent).
dotenvy = "0.15"
# Obfuscated constants (Cloudflare, LLM keys, Treasury, etc.)
# Private repo — CI authenticates via the insteadOf git rewrite (release.yml).
kawai-constants = { path = "../kawai-vault/constants" }
kawai-vault = { path = "../kawai-vault/kawai-vault" }
sha2 = "0.10"
# Office tool store imports (drag-drop/web base64 blobs) + TTS audio payloads.
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# RAG pipeline for knowledge files:
#   kawai-embedding — embed (local LiteRT embedder fallback under the litert
#   feature, desktop only, no API key)
kawai-embedding = { path = "../kawai-embedding" }
# Markdown-aware + char-based chunking for RAG indexing: text-splitter's
# MarkdownSplitter (heading-aware locators) / TextSplitter.
text-splitter = { version = "0.27", features = ["markdown"] }
# Image understanding — reusable DescriberChain (local PaddleOCR → JigsawStack
# VOCR). Single source for RAG indexing (kawai-vision) + ragloader shim.
kawai-vision = { path = "../crates/foundation/vision", features = ["paddle-ocr"] }
ragloader = { path = "../crates/integrations/ragloader", features = ["paddle-ocr"] }
# YouTube transcript fetching for knowledge ingestion.
# Uses reqwest 0.13 — coexists with our direct 0.12 (like the rustls pair).
youtube_transcript = { path = "../crates/integrations/youtube-transcript" }
# Pure-Rust office create/read/edit (vendored submodule): markdown → IR →
# docx/xlsx/pptx (in-process), raw-part surgery for in-place edits. PDF
# operations via pdf_oxide (fetched from GitHub, no local submodule).
office_oxide = { path = "../office_oxide" }
pdf_oxide = { git = "https://github.com/yfedoseev/pdf_oxide", features = ["rendering"] }
regex = "1"
# Web read + search tiering: the reusable crates/toolsets/webread tool crate —
# engine chain + budgets + cache for the `web_read` / `web_search` agent
# tools. `browser` (tier-1 Cloudflare Browser Rendering) rides inside webread
# but stays listed so the headless example can drive it directly.
webread = { path = "../crates/toolsets/webread" }
browser = { path = "../crates/generated-tools/browser" }
# Finance tools (stock price/quote/detail/fundamentals + StockTwits social
# sentiment). Keyed providers (TwelveData/AlphaVantage/Tiingo) fall back to
# the keyless StockTwits provider — see finance::stocktwits.
finance = { path = "../crates/generated-tools/finance" }
url = "2"
# TTS via piper-rs (neural ONNX Piper TTS). Gated behind `tts` so non-TTS
# builds stay dep-free. Adds ~40 MB (static ONNX Runtime) + espeak-ng build
# requirement (cmake + clang).
piper-rs = { version = "0.2.0", optional = true }
# Binance agent tools (builtin.binance): keyless public market data via the
# binance-sdk fork submodule (crates/vendor/binance-connector-rust, patched
# rustls-only) + in-process TA via crates/vendor/ta.
# Android still excluded: never exercised on NDK (un-excluding needs a
# `cargo ndk check --features binance` pass).
[target.'cfg(not(target_os = "android"))'.dependencies]
binance = { path = "../crates/toolsets/binance", optional = true }
# Monad EVM chain client (feature "monad") — read-only public RPC.
kawai-monad = { path = "../crates/integrations/monad", optional = true }

# libSQL-native GraphRAG engine — pure crate (crates/engines/graph). Feature-gated
# so it can be included/excluded as a module (@crates/engines/graph).
# GraphRAG (libSQL-native): Naive/Local/Global/Hybrid/Mix over one DB file.
# Always compiled in — rides the existing libSQL + kawai-embedding stack.
graph = { path = "../crates/engines/graph" }

# Remote SQL sources for the analytics snapshot tools (data_tables /
# data_import over Postgres/MySQL). rustls on purpose — mobile has no
# openssl prebuilts. SQLite stays on the existing libsql dep (always on).
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
] }

# stderr tee for file logging (logging.rs). Unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS native notification via UNUserNotificationCenter (reliable permission
# check + delivery confirmation — the plugin's permission_state is hardcoded).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

[features]
default = []
web = ["dep:axum", "dep:tower-http"]
# CodeGraph — sidecar only (AgentTool + LRU cache, zero cost off)
codegraph = ["dep:codegraph"]
# On-device LLM. Also owns the kawai-router dep (rule-based auto-routing is
# only used by the litert supervisor stack).
litert = ["dep:local-llm", "local-llm/agent-tools", "kawai-embedding/litert", "kawai-agent/litert", "kawai-vision/litert", "kawai-knowledge/litert", "remote-llm/litert", "kawai-analytics/litert", "dep:kawai-router"]
# Binance agent (logic::agent BINANCE_AGENT_ID): read-only public market-data +
# technical-analysis tools. Needs a tool-loop runtime.
binance = ["dep:binance", "kawai-agent/binance"]
# Monad EVM chain client (read-only RPC: balance + chain status). Pure alloy
# HTTP provider — no keys, no signing.
monad = ["dep:kawai-monad"]
# Remote SQL sources (Postgres/MySQL) for the analytics snapshot tools.
# Implies analytics (always compiled); SQLite needs no feature (libsql rides along).
analytics-sql = ["kawai-analytics/analytics-sql", "dep:sqlx"]
# TTS via piper-rs (neural Piper ONNX models). Adds ~40 MB (static ONNX Runtime)
# and requires cmake + clang at build time (espeak-ng phonemizer compiled from source).
tts = ["dep:piper-rs"]
# The full product in one flag (CI battery shorthand): on-device LLM,
# remote SQL, Binance, TTS, CodeGraph, web server.
full = ["litert", "analytics-sql", "binance", "tts", "codegraph", "monad", "web"]

[[bin]]
name = "kawai"
path = "src/main.rs"

[[bin]]
name = "kawai-web"
path = "src/bin/web.rs"
required-features = ["web"]

[[example]]
name = "local_llm_smoke"
required-features = ["litert"]

[[example]]
name = "kv_sweep"
required-features = ["litert"]

[[example]]
name = "remote_smoke"
required-features = ["litert"]

[[example]]
name = "binance_smoke"
required-features = ["binance"]

[[example]]
name = "planner_smoke"
required-features = ["litert", "binance"]

[[example]]
name = "analytics_smoke"
required-features = ["analytics"]

[[example]]
name = "sql_remote_check"
required-features = ["analytics-sql"]

[[example]]
name = "web_read_check"

[[example]]
name = "thinking_smoke"
required-features = ["litert"]

[[example]]
name = "draft_smoke"
required-features = ["litert"]

[[example]]
name = "agent_eval"

[[example]]
name = "turn_log_report"
required-features = ["litert"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.analytics]
opt-level = "z"
[profile.release.package.aws-lc-sys]
opt-level = "z"
[profile.release.package.aws-lc-rs]
opt-level = "z"
[profile.release.package.pdf_oxide]
opt-level = "z"
[profile.release.package.office_oxide]
opt-level = "z"

[profile.release.package.polars]
opt-level = "z"
[profile.release.package.polars-arrow]
opt-level = "z"
[profile.release.package.polars-core]
opt-level = "z"
[profile.release.package.polars-ops]
opt-level = "z"
[profile.release.package.polars-plan]
opt-level = "z"
[profile.release.package.polars-lazy]
opt-level = "z"
[profile.release.package.polars-stream]
opt-level = "z"
[profile.release.package.polars-io]
opt-level = "z"
[profile.release.package.polars-parquet]
opt-level = "z"
[profile.release.package.piper-rs]
opt-level = "z"
[profile.release.package.espeak-rs-sys]
opt-level = "z"
[profile.release.package.ort-sys]
opt-level = "z"

# Redirect crates.io office_oxide to the local fork for the entire dependency
# graph (including pdf_oxide). Prevents duplicate FFI symbols on Linux.
[patch.crates-io]
office_oxide = { path = "../office_oxide" }

[dev-dependencies]
tempfile = "3"
