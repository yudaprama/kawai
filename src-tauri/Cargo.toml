[package]
name = "kawai"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "kawai"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kawai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync"] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
tokio-util = "0.7"
tokio-stream = "0.1"
# Matches the graph majority (hf-hub / tokenizers / jigsawstack run 0.9).
rand = "0.9"

# Web-only deps (gated behind the `web` feature). Excluded entirely from
# desktop/mobile builds.
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", optional = true, features = ["fs"] }
# High-level streaming chat over LiteRT-LM (on-device Gemma 4, etc.).
# Pulls in cognee-litert-lm transitively. Gated behind `litert`.
local-llm = { path = "../local-llm", optional = true }
# Agent-tier runtime (tool dispatch, tool loop) + hybrid cloud-subagent
# streaming client (logic/remote.rs — hand-written OpenAI-compatible SSE).
# default-features=false keeps only the local-SQLite core: replication/remote
# would pull tonic 0.11 + hyper 0.14 + axum 0.6 + rustls 0.22 (dead weight —
# every call site uses Builder::new_local; re-add "remote" with sqld sync).
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
jsonwebtoken = "9"
# rustls (not default features) keeps the TLS stack aligned with libsql and
# compiles for android arm64 + ios arm64. Used for JWKS fetch in auth.rs and
# the remote-tier SSE client. 0.13 matches kawai-embedding — one reqwest in
# the graph; "stream" powers the SSE byte stream.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
# Lock guards without poison-unwrap boilerplate (repo rule: parking_lot over
# std::sync::{Mutex, RwLock} whenever a lock result is immediately unwrapped).
parking_lot = "0.12"
# Loads KAWAI_AUTH_* from the project-root .env in dev (no-op if absent).
dotenvy = "0.15"
# Obfuscated constants (Cloudflare, LLM keys, Treasury, etc.) — local vault
# submodule (build-first; the git release lags the checkout).
kawai-constants = { path = "../kawai-vault/constants" }
# Office tool store imports (drag-drop/web base64 blobs). Gated behind
# "office" so non-office builds stay dep-free.
base64 = { version = "0.22", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
# Embeddings (multi-provider: OpenAI/NVIDIA/Gemini cloud + on-device LiteRT
# EmbeddingGemma, no API key for the local path) — used by the
# knowledge pipeline (crates/engines/knowledge) and supervisor recall.
kawai-embedding = { path = "../kawai-embedding", optional = true }
# Document text extraction for knowledge ingestion (office feature):
# markdown/PDF/office-aware loader. Pulls jigsawstack (reqwest 0.12)
# transitively for image description (DescriberChain).
ragloader = { path = "../crates/integrations/ragloader", optional = true }
# YouTube transcript fetching for knowledge ingestion (office feature).
# Uses reqwest 0.13 — coexists with our direct 0.12 (like the rustls pair).
youtube_transcript = { path = "../crates/integrations/youtube-transcript", optional = true }
# Pure-Rust office create/read/edit (vendored submodule): markdown → IR →
# docx/xlsx/pptx (in-process), raw-part surgery for in-place edits. PDF
# operations via pdf_oxide (yudaprama fork — same source as the other crates
# in the graph; upstream lags office_oxide's DocumentIR schema).
office_oxide = { path = "../office_oxide", optional = true }
pdf_oxide = { git = "https://github.com/yudaprama/pdf_oxide", optional = true }
regex = { version = "1", optional = true }
# Web read tiering (office feature): Cloudflare Browser Rendering fallback
# tier via the generated browser tool crate (reqwest-only, mobile-safe), plus
# the `url` crate for pure URL normalization in logic::scrape.
browser = { path = "../crates/generated-tools/browser", optional = true }
url = { version = "2", optional = true }
# Binance agent tools (builtin.binance): keyless public market data via the
# crates.io binance-sdk (rustls, spot-only) + in-process TA.
binance = { path = "../crates/toolsets/binance", optional = true }
# Accounting agent tools (builtin.accounting): local double-entry ledger,
# GST invoices, reports, GSTR-1 exports via the vendored accounting-core.
accounting-tools = { path = "../crates/toolsets/accounting", optional = true }

# Split-out first-party crates (foundation / engines / toolsets / integrations).
kawai-auth = { path = "../crates/foundation/auth" }
kawai-db = { path = "../crates/foundation/db" }
kawai-paths = { path = "../crates/foundation/paths" }
kawai-events = { path = "../crates/foundation/events" }
kawai-api-types = { path = "../crates/foundation/api-types" }
kawai-agent-contract = { path = "../crates/foundation/agent-contract" }
kawai-memory = { path = "../crates/foundation/memory" }
kawai-skills = { path = "../crates/foundation/skills" }
kawai-agent = { path = "../crates/engines/agent" }
kawai-router = { path = "../crates/router" }
kawai-monad = { path = "../crates/integrations/monad", optional = true }
monad-tools = { path = "../crates/toolsets/monad-tools", optional = true }
# TTS via supertonic (neural MNN TTS, multilingual). Gated behind `tts` so
# non-TTS builds skip the ~191 MB model download and MNN TTS sessions.
supertonic = { path = "../crates/integrations/supertonic", optional = true }
kawai-tool-catalog = { path = "../crates/foundation/tool-catalog" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iana-time-zone = "0.1"
kawai-desk = { path = "../crates/engines/desk" }
kawai-youtube = { path = "../crates/engines/youtube" }
kawai-knowledge = { path = "../crates/engines/knowledge" }
kawai-office = { path = "../crates/engines/office" }

kawai-analytics = { path = "../crates/toolsets/analytics-tools" }
composio = { path = "../crates/toolsets/composio" }
civitai = { path = "../crates/integrations/civitai" }
kawai-tools = { path = "../kawai-tools" }
kawai-dyntoken = { path = "../kawai-vault/dyntoken" }
webread = { path = "../crates/toolsets/webread" }
kawai-cli = { path = "../crates/toolsets/cli" }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }
apify = { path = "../crates/integrations/apify" }
kawai-email = { path = "../crates/integrations/email" }
kawai-vault = { path = "../kawai-vault/kawai-vault" }
kawai-telemetry = { path = "../crates/foundation/telemetry" }
hex = "0.4"
onboarding = { path = "../crates/engines/onboarding", features = ["webread-backend"] }
remote-llm = { path = "../crates/foundation/remote-llm" }
analytics = { path = "../crates/engines/analytics" }
weather_geo = { path = "../crates/generated-tools/weather-geo" } # location_sync_via_tool (ungated)

# Generated tool catalogs — only referenced by litert-gated supervisor fns.
entertainment = { path = "../crates/generated-tools/entertainment", optional = true }
finance = { path = "../crates/generated-tools/finance", optional = true }
news_media = { path = "../crates/generated-tools/news-media", optional = true }
sports = { path = "../crates/generated-tools/sports", optional = true }
food_drink = { path = "../crates/generated-tools/food-drink", optional = true }
geospace = { path = "../crates/generated-tools/geospace", optional = true }
knowledge = { path = "../crates/generated-tools/knowledge", optional = true }
religion = { path = "../crates/generated-tools/religion", optional = true }
utility = { path = "../crates/generated-tools/utility", optional = true }
coinmarketcap = { path = "../crates/generated-tools/coinmarketcap", optional = true }

sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

# stderr tee for file logging (logging.rs). Unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["desktop"]
# Desktop/mobile app shell (tauri builder entry point). Implies office + graph —
# the desktop app ships both (webview_engine's scrape tier needs office; the
# graph ops are desktop-only). The web bin never calls `run()`; server deploys
# build with `--no-default-features --features web`.
desktop = ["office", "graph", "dep:finance", "kawai-agent/webread", "dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-plugin-opener", "dep:tauri-plugin-process", "dep:tauri-plugin-updater", "dep:keyring"]
web = ["dep:axum", "dep:tower-http", "office", "graph"] # office+graph are pure-Rust — the web server ships both; only the tauri shell (desktop) is excluded
litert = ["dep:local-llm", "dep:entertainment", "dep:finance", "dep:news_media", "dep:sports", "dep:food_drink", "dep:geospace", "dep:knowledge", "dep:religion", "dep:utility", "dep:coinmarketcap", "kawai-agent/litert", "kawai-embedding/litert", "kawai-knowledge/media"] # media rides litert: it embeds through the same on-device EG2 engine (audio/video decode needs ffmpeg present at runtime)
# GraphRAG — re-exported from kawai-knowledge behind its own feature.
graph = ["kawai-knowledge/graph", "kawai-agent/graph"]
# Office document tools (logic::office): pure-Rust create/read/edit/info via
# office_oxide and PDF via pdf_oxide (both in-process) — plus the knowledge
# pipeline (crates/engines/knowledge: kawai-embedding + libsql vector/FTS)
# for idle-time knowledge indexing.
office = ["dep:base64", "dep:kawai-embedding", "dep:ragloader", "dep:youtube_transcript", "dep:office_oxide", "dep:pdf_oxide", "dep:regex", "dep:browser", "dep:url", "kawai-agent/office"]
# Binance agent (logic::agent BINANCE_AGENT_ID): read-only public market-data +
# technical-analysis tools. Independent of `office`; needs a tool-loop runtime.
binance = ["dep:binance", "kawai-agent/binance"]
# Accounting agent (builtin.accounting): local double-entry ledger + GST
# via accounting-tools (vendored accounting-core). No external services.
accounting = ["dep:accounting-tools"]
# Monad EVM chain client (read-only RPC: balance + chain status). Pure alloy
# HTTP provider — no keys, no signing. monad-tools carries the read-only
# AgentTool surface (builtin.monad).
monad = ["dep:kawai-monad", "dep:monad-tools"]
# TTS via supertonic (neural MNN TTS, multilingual). Links the same MNN as
# the OCR engine (ocr-rs) — no ONNX Runtime, no espeak-ng. Models
# (~191 MB fp16) download on first use.
tts = ["dep:supertonic"]

[[bin]]
name = "kawai"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "kawai-web"
path = "src/bin/web.rs"
required-features = ["web"]

[[example]]
name = "local_llm_smoke"
required-features = ["litert"]

[[example]]
name = "kv_sweep"
required-features = ["litert"]

[[example]]
name = "remote_smoke"
required-features = ["litert"]

[[example]]
name = "thinking_smoke"
required-features = ["litert", "office"]

[[example]]
name = "draft_smoke"
required-features = ["litert", "office"]

[[example]]
# No required-features: the litert-dependent main is cfg-gated to a stub, so
# the harness unit tests compile under default features (CI runs them litert-
# free in linux-check; the real runs pass --features litert explicitly).
name = "agent_eval"

[[example]]
name = "turn_log_report"
required-features = ["litert"]
[[example]]
name = "route_eval"
required-features = ["litert"]

# Redirect crates.io office_oxide to the local fork for the entire dependency
# graph (including pdf_oxide). Prevents duplicate FFI symbols on Linux.
[patch.crates-io]
office_oxide = { path = "../office_oxide" }

# Redirect the pdf_oxide git source to the vendored submodule for the entire
# graph (src-tauri + ragloader + engines/office) so every consumer builds the
# same in-tree markdown→PDF creator.
[patch."https://github.com/yudaprama/pdf_oxide"]
pdf_oxide = { path = "../pdf_oxide" }

[dev-dependencies]
tempfile = "3"
# `test-util` for `#[tokio::test(start_paused = true)]` — lets the stalled-worker
# timeout test auto-advance the clock instead of sleeping 30s for real.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
