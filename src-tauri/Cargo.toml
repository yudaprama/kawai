[package]
name = "kawai"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "kawai"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kawai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
tokio-util = "0.7"

# Web-only deps (gated behind the `web` feature). Excluded entirely from
# desktop/mobile builds.
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", optional = true, features = ["fs"] }
# On-device LLM (LiteRT-LM C API via cognee-litert-lm). Gated: building the C
# library is opt-in so plain cargo check/build never requires it.
cognee-litert-lm = { path = "../cognee-litert-lm", optional = true }
# Pinned to the same git rev as rig-libsql (submodule): crates.io 0.41.0
# predates the Vec<Embedding> insert_documents change the vector store needs.
# One rig-core source for the whole graph (src-tauri + rig-tools + rig-libsql)
# or ToolSet/vector-store types won't unify. Swap to crates.io "0.42"+ when
# that release ships, everywhere at once.
rig = { git = "https://github.com/0xPlaygrounds/rig", rev = "4232abdb85a3ef2c48ccf3fa5c2cb8636588db94" }
libsql = "0.9.30"
jsonwebtoken = "9"
# rustls-tls (not default features) keeps the TLS stack aligned with libsql/rig
# and compiles for android arm64 + ios arm64. Used only for JWKS fetch in auth.rs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Loads KAWAI_AUTH_* from the project-root .env in dev (no-op if absent).
dotenvy = "0.15"
# Obfuscated constants (Cloudflare, LLM keys, Treasury, etc.)
kawai-constants = { path = "/Users/yuda/github.com/kawai-network/x/rust/constants" }

# stderr tee for file logging (logging.rs). Unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
web = ["dep:axum", "dep:tower-http"]
litert = ["dep:cognee-litert-lm"]

[[bin]]
name = "kawai"
path = "src/main.rs"

[[bin]]
name = "kawai-web"
path = "src/bin/web.rs"
required-features = ["web"]
