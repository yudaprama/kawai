[package]
name = "kawai"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "kawai"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kawai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync"] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
tokio-util = "0.7"
# Matches the graph majority (hf-hub / tokenizers / jigsawstack run 0.9).
rand = "0.9"

# Web-only deps (gated behind the `web` feature). Excluded entirely from
# desktop/mobile builds.
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", optional = true, features = ["fs"] }
# High-level streaming chat over LiteRT-LM (on-device Gemma 4, etc.).
# Pulls in cognee-litert-lm transitively. Gated behind `litert`.
local-llm = { path = "../local-llm", optional = true }
# Phase-1/2/3 extracted crates (pure, no transport). Re-exported via
# `src/auth.rs`, `src/logic/remote.rs`, `src/logic/db.rs`/`db_migrations.rs`,
# `src/logic/skills.rs`/`memory.rs`, `src/logic/office` shims so
# `crate::auth::*` and `crate::logic::*` remain stable.
kawai-auth = { path = "../crates/foundation/auth" }
remote-llm = { path = "../crates/foundation/remote-llm" }
kawai-db = { path = "../crates/foundation/db" }
kawai-skills = { path = "../crates/foundation/skills" }
kawai-memory = { path = "../crates/foundation/memory" }
kawai-office = { path = "../crates/engines/office", optional = true }
kawai-knowledge = { path = "../crates/engines/knowledge", optional = true }
kawai-analytics = { path = "../crates/toolsets/analytics-tools", optional = true }
kawai-agent = { path = "../crates/engines/agent", optional = true }
codegraph = { path = "../crates/toolsets/codegraph", optional = true }
kawai-agent-contract = { path = "../crates/foundation/agent-contract" }
# The agent tool seam (tool trait + registry) shared with components.
kawai-tools = { path = "../kawai-tools" }
# default-features=false keeps only the local-SQLite core: replication/remote
# would pull tonic 0.11 + hyper 0.14 + axum 0.6 + rustls 0.22 (dead weight —
# every call site uses Builder::new_local; re-add "remote" with sqld sync).
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
jsonwebtoken = "9"
# rustls (not default features) keeps the TLS stack aligned with libsql
# and compiles for android arm64 + ios arm64. Used only for JWKS fetch in auth.rs.
# 0.13 matches kawai-embedding/youtube_transcript — one reqwest in the graph.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
# Loads KAWAI_AUTH_* from the project-root .env in dev (no-op if absent).
dotenvy = "0.15"
# Obfuscated constants (Cloudflare, LLM keys, Treasury, etc.)
# Private repo — CI authenticates via the insteadOf git rewrite (release.yml).
kawai-constants = { path = "../kawai-vault/constants" }
# Office tool store imports (drag-drop/web base64 blobs). Gated behind
# "office" so non-office builds stay dep-free.
base64 = { version = "0.22", optional = true }
tauri-plugin-dialog = "2"
# RAG pipeline for office knowledge files (gated behind "office"):
#   kawai-embedding — embed (local LiteRT embedder fallback under the litert
#   feature, desktop only, no API key)
kawai-embedding = { path = "../kawai-embedding", optional = true }
# Markdown-aware + char-based chunking for RAG indexing (office feature only).
# Replaces the in-tree chunk_text sliding window with text-splitter's
# MarkdownSplitter (heading-aware locators) / TextSplitter.
text-splitter = { version = "0.27", features = ["markdown"], optional = true }
# Image understanding for knowledge ingestion (office feature): describe
# images to text via the ragloader DescriberChain (local stub → JigsawStack
# VOCR). Pulls jigsawstack (reqwest 0.12) transitively.
ragloader = { path = "../crates/integrations/ragloader", optional = true }
# YouTube transcript fetching for knowledge ingestion (office feature).
# Uses reqwest 0.13 — coexists with our direct 0.12 (like the rustls pair).
youtube_transcript = { path = "../crates/integrations/youtube-transcript", optional = true }
# Pure-Rust office create/read/edit (vendored submodule): markdown → IR →
# docx/xlsx/pptx (in-process), raw-part surgery for in-place edits. PDF
# operations via pdf_oxide (fetched from GitHub, no local submodule).
office_oxide = { path = "../office_oxide", optional = true }
pdf_oxide = { git = "https://github.com/yfedoseev/pdf_oxide", optional = true }
regex = { version = "1", optional = true }
# Web read + search tiering (webread/office features): the reusable
# crates/toolsets/webread tool crate — engine chain + budgets + cache for the
# `web_read` / `web_search` agent tools. `browser` (tier-1 Cloudflare
# Browser Rendering) rides inside webread but stays listed so the headless
# example can drive it directly.
webread = { path = "../crates/toolsets/webread", optional = true }
browser = { path = "../crates/generated-tools/browser", optional = true }
url = { version = "2", optional = true }
# Binance agent tools (builtin.binance): keyless public market data via the
# binance-sdk fork submodule (crates/vendor/binance-connector-rust, patched
# rustls-only) + in-process TA via crates/vendor/ta.
# Android still excluded: never exercised on NDK (un-excluding needs a
# `cargo ndk check --features binance` pass).
[target.'cfg(not(target_os = "android"))'.dependencies]
binance = { path = "../crates/toolsets/binance", optional = true }

# Data analysis agent (builtin.analytics): structured queries over stored
# tabular files (csv/tsv/parquet + xlsx via the office_oxide bridge) through
# the polars-backed crates/engines/analytics crate. Implies `office` — the
# data files live in the office store.
analytics = { path = "../crates/engines/analytics", optional = true }
# libSQL-native GraphRAG engine — pure crate (crates/engines/graph). Feature-gated
# so it can be included/excluded as a module (@crates/engines/graph).
graph = { path = "../crates/engines/graph", optional = true }

# Remote SQL sources for the analytics snapshot tools (data_tables /
# data_import over Postgres/MySQL). rustls on purpose — mobile has no
# openssl prebuilts. SQLite stays on the existing libsql dep (always on).
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
] }

# stderr tee for file logging (logging.rs). Unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
web = ["dep:axum", "dep:tower-http"]
# CodeGraph — two tiers, both optional (zero cost when off):
#   codegraph        = phase0 sidecar as AgentTool + LRU cache (crate `codegraph`), plus Tauri/web wrappers
#   codegraph-native = phase1 in-process extraction (codegraph-kernel rlib, no Node)
codegraph = ["dep:codegraph"]
codegraph-native = ["codegraph", "codegraph/native"]
litert = ["dep:local-llm", "local-llm/agent-tools", "kawai-embedding/litert", "dep:kawai-agent", "kawai-agent/litert"]
# GraphRAG (libSQL-native): Naive/Local/Global/Hybrid/Mix over one DB file.
# Include with --features graph, exclude by omitting it (zero cost when off).
# Standalone — includes the pure `graph` crate + its DB deps.
graph = ["dep:graph", "dep:kawai-embedding", "dep:text-splitter", "dep:regex", "dep:kawai-knowledge", "kawai-knowledge/graph", "kawai-agent/graph"]
# Web read/search tiering as a standalone feature so any agent can reuse the
# tools without `office`; `office` implies it (behavior-preserving).
webread = ["dep:webread", "dep:browser", "dep:url", "kawai-agent/webread"]
# Office document tools (logic::office): pure-Rust create/read/edit/info via
# office_oxide and PDF via pdf_oxide (both in-process) — plus the RAG pipeline
# (kawai-embedding, with in-tree chunking) for idle-time
# knowledge indexing. Enables the `webread` FEATURE (not just `dep:webread`)
# so its bundled deps ride along.
office = ["dep:base64", "dep:kawai-embedding", "dep:text-splitter", "dep:ragloader", "dep:youtube_transcript", "dep:office_oxide", "dep:pdf_oxide", "dep:regex", "webread", "kawai-db/office", "dep:kawai-office", "dep:kawai-knowledge", "kawai-knowledge/office", "kawai-agent/office"]
# Binance agent (logic::agent BINANCE_AGENT_ID): read-only public market-data +
# technical-analysis tools. Independent of `office`; needs a tool-loop runtime.
binance = ["dep:binance", "kawai-agent/binance"]
# Data analysis agent (logic::agent ANALYTICS_AGENT_ID): data_schema +
# data_query over the office store's tabular files. Implies `office` —
# the files live in the office store and reuse its import UI.
analytics = ["dep:analytics", "office", "kawai-db/analytics", "dep:kawai-analytics", "kawai-agent/analytics"]
# Remote SQL sources (Postgres/MySQL) for the analytics snapshot tools.
# Implies `analytics`; SQLite needs no feature (libsql rides along).
analytics-sql = ["analytics", "kawai-analytics/analytics-sql"]

[[bin]]
name = "kawai"
path = "src/main.rs"

[[bin]]
name = "kawai-web"
path = "src/bin/web.rs"
required-features = ["web"]

[[example]]
name = "local_llm_smoke"
required-features = ["litert"]

[[example]]
name = "kv_sweep"
required-features = ["litert"]

[[example]]
name = "remote_smoke"
required-features = ["litert"]

[[example]]
name = "binance_smoke"
required-features = ["binance"]

[[example]]
name = "analytics_smoke"
required-features = ["analytics"]

[[example]]
name = "sql_remote_check"
required-features = ["analytics-sql"]

[[example]]
name = "web_read_check"
required-features = ["office"]

[[example]]
name = "chat_route_check"
required-features = ["litert"]

[[example]]
name = "thinking_smoke"
required-features = ["litert", "office"]

[[example]]
name = "draft_smoke"
required-features = ["litert", "office"]

[[example]]
name = "agent_smoke"
required-features = ["litert", "office"]

[[example]]
name = "agent_eval"
required-features = ["litert", "office"]

[[example]]
name = "turn_log_report"
required-features = ["litert"]

# Redirect crates.io office_oxide to the local fork for the entire dependency
# graph (including pdf_oxide). Prevents duplicate FFI symbols on Linux.
[patch.crates-io]
office_oxide = { path = "../office_oxide" }

[dev-dependencies]
tempfile = "3"
