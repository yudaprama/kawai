[package]
name = "kawai"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "kawai"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kawai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util"] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
tokio-util = "0.7"

# Web-only deps (gated behind the `web` feature). Excluded entirely from
# desktop/mobile builds.
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", optional = true, features = ["fs"] }
# High-level streaming chat over LiteRT-LM (on-device Gemma 4, etc.).
# Pulls in cognee-litert-lm transitively. Gated behind `litert`.
local-llm = { path = "../local-llm", optional = true }
# Pinned to the same git rev as rig-libsql (submodule): crates.io 0.41.0
# predates the Vec<Embedding> insert_documents change the vector store needs.
# One rig-core source for the whole graph (src-tauri + rig-tools + rig-libsql)
# or ToolSet/vector-store types won't unify. Swap to crates.io "0.42"+ when
# that release ships, everywhere at once.
rig = { git = "https://github.com/0xPlaygrounds/rig", rev = "4232abdb85a3ef2c48ccf3fa5c2cb8636588db94" }
libsql = "0.9.30"
jsonwebtoken = "9"
# rustls-tls (not default features) keeps the TLS stack aligned with libsql/rig
# and compiles for android arm64 + ios arm64. Used only for JWKS fetch in auth.rs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Loads KAWAI_AUTH_* from the project-root .env in dev (no-op if absent).
dotenvy = "0.15"
# Obfuscated constants (Cloudflare, LLM keys, Treasury, etc.)
# Private repo — CI authenticates via the insteadOf git rewrite (release.yml).
kawai-constants = { git = "https://github.com/yudaprama/kawai-vault", subdir = "constants" }
# Office tool store imports (drag-drop/web base64 blobs). Gated behind
# "office" so non-office builds stay dep-free.
base64 = { version = "0.22", optional = true }
tauri-plugin-dialog = "2"
# RAG pipeline for office knowledge files (gated behind "office"):
#   kawai-embedding — embed (local fastembed ONNX fallback, no API key)
#   rig-libsql     — vector store (insert_documents / search)
# Both pinned to the same rig-core rev as the rest of the graph (4232abdb)
# so the vector-store seam unifies with kawai-embedding's EmbeddingModel.
kawai-embedding = { path = "../kawai-embedding", optional = true }
# Markdown-aware + char-based chunking for RAG indexing (office feature only).
# Replaces the in-tree chunk_text sliding window with text-splitter's
# MarkdownSplitter (heading-aware locators) / TextSplitter.
text-splitter = { version = "0.27", features = ["markdown"], optional = true }
rig-libsql = { path = "../rig-libsql", optional = true }
# Image understanding for knowledge ingestion (office feature): describe
# images to text via the ragloader DescriberChain (local stub → JigsawStack
# VOCR). Pulls jigsawstack (reqwest 0.12) transitively.
ragloader = { path = "../rig-components/ragloader", optional = true }
# YouTube transcript fetching for knowledge ingestion (office feature).
# Uses reqwest 0.13 — coexists with our direct 0.12 (like the rustls pair).
youtube_transcript = { path = "../rig-components/youtube_transcript", optional = true }
# rig-core is a direct dep (not just transitive) because logic::rag uses its
# `Embed` derive + `EmbeddingsBuilder`/`InsertDocuments` traits directly. Pinned
# to the SAME rev as every other rig consumer in the graph (4232abdb) so the
# vector-store seam unifies with kawai-embedding's `EmbeddingModel`.
rig-core = { git = "https://github.com/0xPlaygrounds/rig", rev = "4232abdb85a3ef2c48ccf3fa5c2cb8636588db94", optional = true }

# stderr tee for file logging (logging.rs). Unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
web = ["dep:axum", "dep:tower-http"]
litert = ["dep:local-llm", "local-llm/rig-tools"]
# Office document tools (logic::office): external CLI engines (ooxcli/pdfcli/
# docbuilder) resolved at runtime — plus the RAG pipeline (kawai-embedding →
# rig-libsql, with in-tree chunking) for idle-time knowledge indexing.
office = ["dep:base64", "dep:kawai-embedding", "dep:rig-libsql", "dep:rig-core", "dep:text-splitter", "dep:ragloader", "dep:youtube_transcript"]

[[bin]]
name = "kawai"
path = "src/main.rs"

[[bin]]
name = "kawai-web"
path = "src/bin/web.rs"
required-features = ["web"]
