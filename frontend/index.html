<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kawai</title>
    <script src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "shiki": "https://esm.sh/shiki@4.4.3",
          "shiki/engine/javascript": "https://esm.sh/shiki@4.4.3/engine/javascript",
          "mermaid": "https://esm.sh/mermaid@11.16.1",
          "katex": "https://esm.sh/katex@0.18.4",
          "rehype-katex": "https://esm.sh/rehype-katex@7.0.1"
        }
      }
    </script>
    <link rel="stylesheet" href="https://esm.sh/katex@0.18.4/dist/katex.min.css" />
    <script>
      // Set the theme before paint to avoid a flash of the wrong theme.
      // Key matches the one written by hooks/use-theme.ts ("kawai-theme").
      (function () {
        try {
          var t = localStorage.getItem("kawai-theme"); // "light" | "dark" | "system" | null
          var dark =
            t === "dark" ||
            (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
