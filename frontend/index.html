<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content pins the IME behavior every h-dvh /
     min-h-dvh layout here assumes: the keyboard SHRINKS the viewport
     (adjustResize in the manifest). Chrome 108+ browsers default to
     resizes-visual; WebView is exempt today, but pin it so a future WebView
     convergence (or serving this UI from a browser) cannot silently break
     the pinned composers and centered forms. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>kawai</title>
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <!-- GUARD: these pinned versions MUST stay in sync with the exact (no ^) versions
         of the same packages in the root package.json. package.json exists for
         typecheck/dev-server; at build time vite.config.ts rollupOptions.external
         keeps them out of the bundle and this importmap serves them from esm.sh
         at runtime. If the two drift, typecheck validates one version while the
         CDN loads another. Update BOTH in the same commit.
         katex CSS is NOT linked here: a head stylesheet from the CDN would be
         render-blocking (first paint waits on esm.sh). The math plugin injects
         it when its (lazily loaded) module runs — keep that URL in sync too. -->
    <script type="importmap">
      {
        "imports": {
          "shiki": "https://esm.sh/shiki@4.4.3",
          "shiki/engine/javascript": "https://esm.sh/shiki@4.4.3/engine/javascript",
          "mermaid": "https://esm.sh/mermaid@11.16.1",
          "katex": "https://esm.sh/katex@0.18.4",
          "rehype-katex": "https://esm.sh/rehype-katex@7.0.1",
          "marked": "https://esm.sh/marked@18.0.10",
          "unified": "https://esm.sh/unified@11.0.5",
          "remark-parse": "https://esm.sh/remark-parse@11.0.0",
          "remark-rehype": "https://esm.sh/remark-rehype@11.1.2",
          "remark-gfm": "https://esm.sh/remark-gfm@4.0.1",
          "remark-math": "https://esm.sh/remark-math@6.0.0",
          "rehype-raw": "https://esm.sh/rehype-raw@7.0.0",
          "rehype-sanitize": "https://esm.sh/rehype-sanitize@6.0.0"
        }
      }
    </script>
    <script>
      // Set the theme before paint to avoid a flash of the wrong theme.
      // Key matches the one written by hooks/use-theme.ts ("kawai-theme").
      (function () {
        try {
          var t = localStorage.getItem("kawai-theme"); // "light" | "dark" | "system" | null
          var dark =
            t === "dark" ||
            (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          // Android edge-to-edge: sync status-bar icon contrast with the APP
          // theme at first paint (bridge registered in MainActivity before
          // load, so it exists here; absent on desktop/web).
          try { if (window.KawaiStatusBar) window.KawaiStatusBar.setLightIcons(!dark); } catch (e) {}
        } catch (e) {}
        // Replay the active palette's tokens before paint (written by
        // lib/themes.ts). Without this the app would flash the stylesheet
        // palette on every launch. Key matches SNAPSHOT_KEY there.
        try {
          var snap = localStorage.getItem("kawai-palette-vars");
          if (snap) {
            var p = JSON.parse(snap);
            var vars = dark ? p.dark : p.light;
            var css = "";
            for (var key in vars) css += "--" + key + ":" + vars[key] + ";";
            var paletteStyle = document.createElement("style");
            paletteStyle.textContent = ":root{" + css + "}";
            document.head.appendChild(paletteStyle);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
