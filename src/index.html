<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kawai</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
            data-clerk-publishable-key="pk_test_ZXhhY3QtdGVycmVwaW4tNTAuY2xlcmsuYWNjb3VudHMuZGV2JA"
            defer></script>
    <!-- main.js MUST load before Alpine: it registers the Alpine store on
         alpine:init, which fires while Alpine executes. Module + defer
         scripts run in document order. -->
    <script type="module" src="main.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body>
    <main class="max-w-2xl mx-auto p-6 space-y-6" x-data>
      <h1 class="text-3xl font-bold">Kawai</h1>

      <!-- Auth -->
      <section class="card bg-base-100 shadow-sm">
        <div class="card-body">
          <h2 class="card-title">Auth (Clerk)</h2>
          <div x-show="!$store.app.userId" class="flex gap-2">
            <button class="btn btn-primary" @click="openSignIn()">Sign in</button>
            <button class="btn btn-ghost" @click="openSignUp()">Sign up</button>
          </div>
          <p x-show="$store.app.clerkError" class="text-error text-sm" x-text="$store.app.clerkError"></p>
          <div x-show="$store.app.userId" class="flex items-center gap-2">
            <span>backend user: <b class="font-mono" x-text="$store.app.userId"></b></span>
            <button class="btn btn-ghost btn-sm" @click="signOut()">Sign out</button>
          </div>
        </div>
      </section>

      <!-- RPC -->
      <section class="card bg-base-100 shadow-sm">
        <div class="card-body">
          <h2 class="card-title">RPC (request-response)</h2>
          <form @submit.prevent="greet" class="flex gap-2">
            <input x-model="$store.app.greetInput" placeholder="Enter a name..." class="input input-bordered flex-1" />
            <button type="submit" class="btn btn-primary">Greet</button>
          </form>
          <p id="greet-msg" x-text="$store.app.greetMsg" :class="$store.app.greetError ? 'text-error' : ''" class="text-sm"></p>
        </div>
      </section>

      <!-- Streaming -->
      <section class="card bg-base-100 shadow-sm">
        <div class="card-body">
          <h2 class="card-title">Streaming</h2>
          <div class="flex gap-2">
            <button class="btn btn-primary" @click="startStream" x-show="!$store.app.stream.active">Start stream</button>
            <button class="btn btn-ghost" @click="stopStream" x-show="$store.app.stream.active">Stop</button>
          </div>
          <progress class="progress progress-primary w-full" :max="$store.app.stream.total" :value="$store.app.stream.done"
                    x-show="$store.app.stream.active"></progress>
          <ul class="list-none p-0 m-0 font-mono text-xs">
            <template x-for="(item, i) in $store.app.stream.log" :key="i">
              <li class="py-0.5" x-text="item"></li>
            </template>
          </ul>
        </div>
      </section>

      <!-- Local LLM -->
      <section class="card bg-base-100 shadow-sm">
        <div class="card-body">
          <h2 class="card-title">Local LLM (on-device, LiteRT-LM)</h2>

          <div class="flex flex-wrap gap-2 items-center">
            <select x-model="$store.app.llm.modelPreset" class="select select-bordered flex-1 min-w-52"
                    :disabled="$store.app.llm.chatActive || $store.app.llm.loading">
              <option value="">— pilih model —</option>
              <option value="/Users/yuda/ai-orchestration/kawai/models/gemma-4-E2B-it.litertlm">Gemma 4 E2B · CPU</option>
              <option value="/Users/yuda/ai-orchestration/kawai/models/gemma-4-E2B-it-gpu.litertlm">Gemma 4 E2B · GPU (artisan)</option>
              <option value="/Users/yuda/ai-orchestration/kawai/models/Qwen2.5-1.5B-Instruct_multi-prefill-seq_q8_ekv4096.litertlm">Qwen2.5 1.5B q8 · CPU</option>
              <option value="custom">Custom path…</option>
            </select>
            <select x-model="$store.app.llm.backend" class="select select-bordered w-28"
                    :disabled="$store.app.llm.chatActive || $store.app.llm.loading">
              <option value="cpu">CPU</option>
              <option value="gpu">GPU</option>
            </select>
            <label class="label cursor-pointer gap-1" title="Speculative decoding (Multi-Token Prediction)">
              <input type="checkbox" x-model="$store.app.llm.specDec" class="checkbox checkbox-xs"
                     :disabled="$store.app.llm.chatActive || $store.app.llm.loading" />
              <span class="label-text text-xs">Spec</span>
            </label>
            <button class="btn btn-primary" @click="loadModel()"
                    :disabled="$store.app.llm.loading || !$store.app.llm.modelPreset || ($store.app.llm.modelPreset === 'custom' && !$store.app.llm.modelPath.trim())">
              <span x-show="$store.app.llm.loading" class="loading loading-spinner loading-xs"></span>
              Load
            </button>
          </div>

          <input x-show="$store.app.llm.modelPreset === 'custom'" x-model="$store.app.llm.modelPath"
                 placeholder="/absolute/path/to/model.litertlm"
                 class="input input-bordered w-full font-mono text-xs" />

          <p x-text="$store.app.llm.modelStatus"
             :class="$store.app.llm.modelError ? 'text-error' : ($store.app.llm.modelLoaded ? 'text-success' : '')"
             class="text-sm"></p>

          <div x-show="$store.app.llm.modelLoaded" class="space-y-3">
            <div class="flex gap-2 flex-wrap">
              <button class="btn btn-xs btn-ghost" @click="resetChat()"
                      :disabled="$store.app.llm.chatActive"
                      title="Reset conversation history">
                Reset Chat
              </button>
              <button class="btn btn-xs"
                      :class="$store.app.llm.thinking ? 'btn-warning' : 'btn-ghost'"
                      @click="toggleThinking()"
                      :disabled="$store.app.llm.chatActive"
                      title="Toggle thinking/reasoning mode">
                Thinking: <span x-text="$store.app.llm.thinking ? 'ON' : 'OFF'"></span>
              </button>
              <button class="btn btn-xs btn-error btn-outline" @click="unloadModel()"
                      :disabled="$store.app.llm.chatActive"
                      title="Unload model and free memory">
                Unload
              </button>
            </div>
            <div id="local-chat-log" class="flex flex-col gap-2 max-h-96 overflow-y-auto bg-base-200 rounded-box p-3">
              <template x-for="(m, i) in $store.app.llm.messages" :key="i">
                <div :class="m.role === 'user' ? 'chat chat-end' : 'chat chat-start'">
                  <div class="chat-bubble whitespace-pre-wrap"
                       :class="m.role === 'user' ? 'chat-bubble-primary' : (m.role === 'error' ? 'chat-bubble-error' : '')"
                       x-text="m.text"></div>
                </div>
              </template>
              <div x-show="$store.app.llm.chatActive" class="text-xs opacity-50 self-start px-2">● generating…</div>
            </div>

            <input type="file" id="image-input" accept="image/*" class="hidden" onchange="onImageSelected(event)" />

            <div x-show="$store.app.llm.pendingImage" class="flex items-center gap-2 text-xs bg-base-200 rounded-box px-3 py-2">
              <span class="opacity-60">📷</span>
              <span x-text="$store.app.llm.pendingImageName" class="truncate flex-1"></span>
              <button type="button" class="btn btn-xs btn-ghost" @click="clearImage()">✕</button>
            </div>

            <div x-show="$store.app.llm.pendingAudio" class="flex items-center gap-2 text-xs bg-base-200 rounded-box px-3 py-2">
              <span class="opacity-60">🎤</span>
              <span x-text="$store.app.llm.pendingAudioName" class="truncate flex-1"></span>
              <button type="button" class="btn btn-xs btn-ghost" @click="clearAudio()">✕</button>
            </div>

            <form @submit.prevent="chat" class="flex gap-2">
              <input x-model="$store.app.llm.chatInput" placeholder="Tanya model lokal… (multi-turn, riwayat di engine)"
                     class="input input-bordered flex-1" :disabled="$store.app.llm.chatActive" />
              <button type="button" class="btn btn-ghost btn-sm" @click="pickImage()" :disabled="$store.app.llm.chatActive"
                      title="Attach image">📷</button>
              <button type="button"
                      :class="$store.app.llm.recording ? 'btn-error animate-pulse' : 'btn-ghost'"
                      class="btn btn-sm" @click="toggleRecord()" :disabled="$store.app.llm.chatActive"
                      title="Record audio">🎤</button>
              <button type="submit" class="btn btn-primary" x-show="!$store.app.llm.chatActive">Kirim</button>
              <button type="button" class="btn btn-ghost" @click="stopChat" x-show="$store.app.llm.chatActive">Stop</button>
            </form>
            <p class="text-xs opacity-60 font-mono" x-text="$store.app.llm.stats"></p>
          </div>
        </div>
      </section>

      <!-- Notes -->
      <section class="card bg-base-100 shadow-sm">
        <div class="card-body">
          <h2 class="card-title">Notes (per-user, sqld)</h2>
          <div x-show="$store.app.userId" class="space-y-4">
            <form @submit.prevent="addNote" class="flex gap-2">
              <input x-model="$store.app.noteInput" placeholder="Write a note..." class="input input-bordered flex-1" />
              <button type="submit" class="btn btn-primary">Add</button>
            </form>
            <p id="notes-error" x-text="$store.app.notesError" x-show="$store.app.notesError" class="text-error text-sm"></p>
            <ul class="list-none p-0 m-0 font-mono text-sm">
              <template x-for="(note, i) in $store.app.notes" :key="i">
                <li class="py-1"><span class="opacity-50" x-text="'#' + note.id"></span> <span x-text="note.body"></span></li>
              </template>
            </ul>
          </div>
          <p x-show="!$store.app.userId" class="text-sm opacity-60">Sign in to use notes.</p>
        </div>
      </section>
    </main>
  </body>
</html>
