name: ci

# Regression gates (AGENTS.md "Verify before considering work done" + Roadmap
# MVP 3): unit tests and the on-device/hybrid-tier smokes on every push to
# main and every PR. litert-dependent smokes run on the three desktop
# platforms (macOS arm64 + Linux x86_64 here; Windows x86_64 in
# windows-smoke.yml — it needs a 3h+ cold compile, so it runs nightly/dispatched
# instead).
#
# The agent_eval quality suites (office + analytics, E4B) live in evals.yml —
# they run in parallel with this workflow and the release build so the
# push→draft pipeline does not serialize behind an on-device eval battery.
# A red eval never deletes the draft: drafts are human-published, and eval
# status is part of that pre-publish check.
#
# release.yml (app bundles) is gated on this workflow's conclusion via
# workflow_run — a green run on main is what starts a release.
# NOTE: every push to main (including the release bot's bump commits) runs
# here too — the cached litert-lm dylib set makes that cheap: the bazel
# build only runs when the LiteRT-LM source or its bundling moves.
#
# agent_smoke (the full local→cloud turn) is intentionally NOT run here: it
# needs interactive cloud-side state beyond the smokes. Run it manually
# (see its header comment) before tagging a release.
#
# android-check gates the Android compile of release-android's exact feature
# set on its single ABI (aarch64): the tts chain (supertonic → ocr-rs MNN
# prebuilt, static-linked), the litert chain (cognee-litert-lm bindgen over
# the nested LiteRT-LM C headers), binance, accounting, mexc — check-only, no
# APK. The Android RUNTIME gate lives in android-smoke.yml (separate
# workflow: nightly + dispatched + after green ci, the windows-smoke
# pattern — it adds a second bazel graph, a full aarch64 cross-compile and
# an emulator boot, too heavy for this push cadence). armeabi-v7a is not
# built: the LiteRT-LM C library exists for android_arm64 only, and a
# GB-scale model does not fit a 32-bit address space.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No concurrency cancel: runs always complete. Rapid pushes run in parallel
# (job-level runner limits may still queue some jobs). Costs more Actions
# minutes; revert by restoring:
#   concurrency:
#     group: ci-${{ github.ref }}
#     cancel-in-progress: true

jobs:
  # ── Fast gate: frontend + web feature (no C toolchain) ────────────────────
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - name: Lint frontend (biome — vendored dirs excluded)
        run: bun run lint

      - name: Test frontend (vitest — pure helpers)
        run: bun run test

      - name: Build frontend (tsc -b + vite)
        run: bun run build

      # Cargo parses local-llm's and cognee-litert-lm's manifests even without
      # the litert feature (optional deps still resolve) — the dirs must
      # exist. local-llm path-deps crates tools; office needs
      # office_oxide. Shallow, non-recursive: manifests only, no C sources.
      # Exception: crates' nested binance-connector-rust submodule is
      # a real path dep (binance feature) — cargo resolution needs its manifest.
      # pdf_oxide is full source, not a manifest: the [patch] in
      # src-tauri/crates/kawai-web Cargo.toml redirects the git dep to the
      # vendored checkout, and the web feature implies office (→ pdf_oxide).
      - name: Init submodules (manifest only)
        run: |
          git submodule update --init local-llm cognee-litert-lm crates kawai-embedding office_oxide kawai-vault rust-paddle-ocr pdf_oxide
          git -C crates submodule update --init vendor/binance-connector-rust

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Default post-if is `success()`: a timed-out run saves no target
          # dir, so the next run recompiles from cold (the 120/150-min loop).
          cache-on-failure: true

      # Generated TS must match the Rust types — fails when a Rust-side
      # event/DTO change wasn't followed by `bun run generate:events`.
      - name: Generated bindings drift gate
        run: |
          bun run generate:events
          git diff --exit-code frontend/src/generated/

      # True kawai-web deploy gate: web feature without desktop/tauri (matches
      # kawai-web/Cargo.toml's default-features=false, features=[web]). The web
      # feature implies office+graph (both pure-Rust) — only the tauri shell is
      # excluded; the desktop bin is skipped via required-features.
      - name: cargo check (web only; no desktop/tauri)
        run: cargo check --no-default-features --features web
        working-directory: src-tauri

  # ── Linux desktop gate: litert + the full feature battery compile on Linux ─
  linux-check:
    runs-on: ubuntu-22.04
    # 30m was not enough: the battery of `cargo check --features …` runs plus
    # the agent_eval harness compile reaches ~28m on a cold cache, leaving the
    # `cargo test (agent_eval harness)` build without the time to compile —
    # the job was killed mid-compile by the job-level timeout, not by a test
    # failure.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: oven-sh/setup-bun@v2


      # Recursive: the litert feature runs bindgen, which parses the C headers
      # of the NESTED submodule cognee-litert-lm/vendor/LiteRT-LM.
      - name: Init submodules (recursive — bindgen needs nested LiteRT-LM headers)
        run: git submodule update --init --recursive local-llm cognee-litert-lm crates kawai-embedding office_oxide kawai-vault rust-paddle-ocr pdf_oxide kawai-server

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates
            local-llm
          # Default post-if is `success()`: a timed-out run saves no target
          # dir, so the next run recompiles from cold (the 120/150-min loop).
          cache-on-failure: true

      # Tauri needs GTK/webkit headers; bindgen (litert feature) needs libclang.
      # clang-18 NOT needed here — cargo check doesn't build the LiteRT-LM C
      # library (bindgen only parses the C headers via libclang).
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libclang-dev

      # Feature-matrix compile gate in 2 runs: the combo turns every feature
      # on (all cfg(feature = …) code compiles), the default run compiles
      # every cfg(not(feature = …)) stub. Mixed regions (e.g. litert without
      # binance) are covered by linux-smoke's `--features litert` test build.
      - name: cargo check (all features on)
        run: cargo check --features litert,office,binance,graph,web,accounting,mexc,tts
        working-directory: src-tauri

      # Data analysis agent (polars + office_oxide xlsx bridge) is always
      # compiled — the default-feature check is its compile gate, backed by
      # the crate's unit tests below (AST translation, dtype coercion,
      # sidecar cache; fixture parquet/csv/xlsx built in-test).
      - name: cargo check (default desktop feature set)
        run: cargo check
        working-directory: src-tauri

      # Lightweight audit: duplicate crate versions (no release build, no CPU heavy).
      # Reports `cargo tree --duplicates` — base64/phf/hashbrown multi-versions
      # are the expected hotspots (see docs). Non-blocking: just logs.
      - name: Duplicate crates audit (cargo tree --duplicates)
        run: |
          echo "## Duplicate crates (cargo tree --duplicates)" >> "$GITHUB_STEP_SUMMARY"
          cargo tree --duplicates 2>&1 | tee /tmp/dup.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -n 80 /tmp/dup.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Top duplicates:"
          cargo tree --duplicates 2>&1 | grep -E "^[a-z].* v[0-9]" | cut -d' ' -f1 | sort | uniq -c | sort -nr | head -n 20 | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: src-tauri

      # kawai-server auth worker (TypeScript, Cloudflare Workers): type gate for
      # the D1 auth directory + Ed25519 token mint/verify (see kawai-server/worker).
      - name: typecheck (kawai-server worker)
        run: bun install --frozen-lockfile && bun run typecheck
        working-directory: kawai-server/worker

      - name: cargo test (crates/engines/analytics)
        run: cargo test -p analytics
        working-directory: crates

      # Webread crate: engine-chain unit tests — html-to-markdown-rs render,
      # {t,x,h} payload split, plain-text fallback, search relevance gate.
      - name: cargo test (crates/toolsets/webread)
        run: cargo test -p webread
        working-directory: crates

      # CodeGraph crate: LRU cache + single-flight + rate limit + sidecar contract
      - name: cargo test (crates/toolsets/codegraph)
        run: cargo test -p codegraph
        working-directory: crates

      # Monad crates: alloy Transfer decoder + range shrink/merge (pure, no
      # network) + the read-only tool arg resolution / registration contracts.
      - name: cargo test (crates/integrations/monad)
        run: cargo test -p kawai-monad
        working-directory: crates

      - name: cargo test (crates/toolsets/monad-tools)
        run: cargo test -p monad-tools
        working-directory: crates

      # Binance toolset: venue-order guards (LOT_SIZE / PERCENT_PRICE /
      # halted-contract refusals), the venue error taxonomy behind every order
      # write, FIFO fill→round-trip matching + per-trade statistics, and the
      # realized-PnL ledger round-trip through real SQLite. Pure + local DB —
      # no API keys, no network, no LLM.
      # Accounting tools (double-entry ledger + trading-books reporting):
      # store round-trips (BigDecimal over TEXT), the fill-mirror reader, the
      # report/import tool contract, and the flat `kind`-tagged payload
      # contract the frontend renderers guard on. Pure + local SQLite.
      - name: cargo test (crates/toolsets/accounting)
        run: cargo test -p accounting-tools
        working-directory: crates

      - name: cargo test (crates/toolsets/binance)
        run: cargo test -p binance
        working-directory: crates

      # Recap cron (billing Variant A): unit test aritmetika uang (base/cursor/
      # rebase/unattributed) + truncate char-boundary — murni offline.
      - name: cargo test (crates/ops/recap)
        run: cargo test -p kawai-recap
        working-directory: crates

      # PaddleOCR on-device OCR (kawai-vision paddle-ocr feature): compile gate
      # + live inference smoke. The MNN prebuilt lib downloads during the cargo
      # build; the tiny model suite (det/rec/keys, ~4 MB total) is downloaded
      # by the smoke itself via ensure_models() and cached between runs.
      - name: cargo check (kawai-vision paddle-ocr feature)
        run: cargo check -p kawai-vision --features paddle-ocr
        working-directory: crates

      - name: Cache PaddleOCR smoke models
        id: paddle-models
        uses: actions/cache@v4
        with:
          path: ~/.kawai/models/ocr
          key: paddle-ocr-v6-tiny-models

      - name: paddle_ocr_smoke (on-device OCR regression)
        working-directory: crates
        run: cargo run --quiet -p kawai-vision --features paddle-ocr --example paddle_ocr_smoke

      # agent_eval harness unit tests: assert grammar (scalar == over
      # string/bool/number, in:, re:, list), slash-path lookup, call-line
      # parsing. Pure Rust — no model file needed. Guards the scorer itself:
      # a string-only == extraction here once made A03/A06/A07 unpassable.
      # Office-only (no litert) so the native .so is not needed — this stays in
      # the fast linux-check gate. The litert-dependent main is cfg-gated.
      - name: cargo test (agent_eval harness)
        run: cargo test --quiet --example agent_eval
        working-directory: src-tauri

      # The tier-0 extractor JS must stay parseable — a syntax error fails
      # SILENTLY (eval never returns a payload → every read falls through to
      # Cloudflare). Node parses the const and checks the payload shape; no
      # DOM here, so the catch path ({t,x,e}) is the expected outcome.
      - name: webview EXTRACTOR JS sanity (parse + JSON shape)
        run: |
          python3 - <<'EOF'
          import re
          src = open('src-tauri/src/webview_engine.rs').read()
          m = re.search(r'const EXTRACTOR: &str = r#"(.*?)"#;', src, re.S)
          open('/tmp/extractor.js', 'w').write(
              "const out = (" + m.group(1) + ");\n"
              + "const p = JSON.parse(out);\n"
              + "if (!('x' in p)) { throw new Error('payload missing x'); }\n"
              + "console.log('extractor ok');\n")
          EOF
          node /tmp/extractor.js

  # ── Android compile gate: release-android's feature set (no APK) ─────────
  # Proves the tts feature chain (supertonic → ocr-rs, MNN prebuilt from
  # zibo-chen/MNN-Prebuilds, static-linked) and the litert chain
  # (cognee-litert-lm bindgen over the nested LiteRT-LM C headers) compile and
  # link for aarch64-linux-android — the only target release-android builds.
  # The MNN prebuilt downloads inside ocr-rs's build.rs; the ~191 MB TTS models
  # are a runtime download, not needed for a check.
  android-check:
    runs-on: ubuntu-latest
    # tts (MNN prebuilt) + litert (bindgen over the full LiteRT-LM header tree,
    # the whole local-llm/embedding stack) on a cold aarch64 target dir.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # Recursive: the litert feature runs bindgen, which parses the C headers
      # of the NESTED submodule cognee-litert-lm/vendor/LiteRT-LM. Recursion
      # also initialises crates/vendor/binance-connector-rust (a real path dep
      # for the binance feature). Full rust-paddle-ocr sources for the tts chain.
      - name: Init submodules
        run: git submodule update --init --recursive local-llm cognee-litert-lm crates kawai-embedding office_oxide kawai-vault rust-paddle-ocr pdf_oxide

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Own shared-key: the android target dirs must not thrash the linux
      # desktop jobs' cache (same host triple, different --target).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: android-check
          cache-on-failure: true

      # bindgen (ocr-rs and cognee-litert-lm build-deps) needs libclang; cmake
      # ships with the runner.
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libclang-dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # See release-android.yml: the runner's preinstalled cmdline-tools
          # cannot parse SDK XML v4; install cmdline-tools;latest first.
          packages: 'cmdline-tools;latest'

      # NDK only — a check links no APK, so no platform/build-tools. Same NDK
      # 28 release-android builds with.
      - name: Install Android NDK 28
        run: |
          set -euo pipefail
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/latest*/bin/sdkmanager | sort -V | tail -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cache cargo-ndk
        id: cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      # Feature set = EXACTLY what release-android ships (default `desktop` +
      # litert, tts, binance, accounting, mexc) on its single ABI. `check`
      # compiles Rust + runs bindgen against the nested C headers — no
      # liblitert-lm.so is needed (release builds it separately and stages it
      # into jniLibs); cognee-litert-lm's build.rs resolves the clang sysroot
      # from ANDROID_NDK_HOME (set above).
      # -P (capital) is the cargo-ndk platform flag; -p collides with cargo
      # --package. Keep secrets out of the env: cargo-ndk's panic handler
      # dumps all env vars to stdout.
      - name: cargo ndk check (aarch64, release feature set)
        working-directory: src-tauri
        run: cargo ndk -t arm64-v8a -P 24 check --features litert,tts,binance,accounting,mexc

  # ── Android on-device smoke ───────────────────────────────────────────────
  # Lives in android-smoke.yml (nightly + after green ci + dispatched, the
  # windows-smoke pattern): it adds a second bazel graph (android_arm64), a
  # full aarch64 cross-compile and an emulator boot — too heavy for the push
  # cadence. android-check above stays the every-push Android gate.
  #
  # ── Full gate: unit tests + on-device smoke + hybrid cloud smokes ─────────
  macos-smoke:
    runs-on: macos-26
    timeout-minutes: 120
    # CI runners are ephemeral: debuginfo and incremental artifacts lengthen
    # cold Rust builds but do not change the test or smoke binaries' behavior.
    # Keep source locations in normal compiler diagnostics; runtime backtraces
    # are the only intentionally reduced diagnostic detail here.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Default post-if is `success()`: a timed-out run saves no target
          # dir, so the next run recompiles from cold (the 120/150-min loop).
          cache-on-failure: true

      # Tool-catalog embedded replica (headless data root = /tmp/kawai).
      # planner_smoke opens the replica and a FRESH one full-downloads the
      # whole ~46 MB catalog from Turso EVERY run — the syncs-quota drain.
      # Static key: the save is skipped once the key exists, so the replica
      # ages deliberately — staleness is safe because the supervisor's
      # row_counts gate detects local < remote and delta-syncs (KBs), and
      # equal counts skip the sync entirely (zero bytes).
      - name: Cache tool-catalog replica
        uses: actions/cache@v4
        with:
          path: /tmp/kawai/tool-catalog
          key: tool-catalog-replica-v1

      - name: Init submodules (local-llm + cognee-litert-lm + crates + kawai-embedding + office_oxide + kawai-vault)
        run: git submodule update --init --recursive local-llm cognee-litert-lm crates kawai-embedding office_oxide kawai-vault rust-paddle-ocr pdf_oxide

      # ── Cached LiteRT-LM dylib set (the expensive bazel artifact) ─────────
      # Keyed on the LiteRT-LM commit actually checked out (the fork branch —
      # carries the macOS sentencepiece patch) + the bundling script that
      # post-processes the dylibs, so the ~15-30 min bazel build only runs
      # when the engine source or its packaging moves. actions/cache is
      # repo-wide, not per-workflow: release.yml build-macos and evals.yml
      # can restore the same key with the identical key + path pair.
      # NO restore-keys on purpose: a partial hit would restore dylibs built
      # from different sources.
      - name: LiteRT-LM dylib cache key
        id: litert-lib-key
        run: |
          set -euo pipefail
          echo "sha=$(git -C cognee-litert-lm/vendor/LiteRT-LM rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore litert-lm dylibs
        id: litert-lib
        uses: actions/cache@v4
        with:
          path: cognee-litert-lm/native
          key: litert-lib-macos26-arm64-${{ steps.litert-lib-key.outputs.sha }}-${{ hashFiles('scripts/bundle-litert-dylibs.sh') }}

      # Bazel is only needed on a dylib-cache miss — skip the multi-GB cache
      # restore and the build together on a hit. Mounted below the submodule
      # init so the WORKSPACE hash in the key actually resolves (the old
      # pre-init position hashed an empty tree → constant key). Same
      # per-runner-generation caveat as release.yml build-macos: objects built
      # against an older Xcode's libc++ headers must not be reused after a
      # toolchain jump.
      - name: Mount bazel cache
        if: steps.litert-lib.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            /private/var/tmp/_bazel_runner
          key: bazel-macos26-arm64-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/WORKSPACE', 'cognee-litert-lm/vendor/LiteRT-LM/.bazelrc') }}
          restore-keys: bazel-macos26-arm64-

      - name: Build litert-lm dylib
        if: steps.litert-lib.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_arm64"
          cd cognee-litert-lm/vendor/LiteRT-LM
          bazel build //c:litert-lm --config=macos_arm64 --jobs=6
          mkdir -p ../../native
          cp bazel-bin/c/liblitert-lm.dylib ../../native/
          install_name_tool -id @rpath/liblitert-lm.dylib ../../native/liblitert-lm.dylib
          bash ../../../scripts/bundle-litert-dylibs.sh

      # ── Unit tests (41: fence parsing, transcript compaction, draft JSON,
      #    ooxml round-trips, rag FTS mirror …) ──
      - name: cargo test (litert + office)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo test --features litert --lib

      # ── Unit tests (local-llm: generation gate, FIFO queue, stateless
      #    reset, tool-call parsing, message builder) ──
      - name: cargo test (local-llm; generation gate + queue)
        working-directory: local-llm
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
        run: cargo test --lib

      # ── Smoke 1: on-device streaming (Roadmap MVP 3). The PRODUCTION model:
      #    gemma-4-E4B-it (litert-community, public) — the same weights the
      #    desktop bundles and evals.yml ship.
      # Same quota rationale as linux-smokes: no model cache — the 3.5 GB
      # entry was the largest eviction driver in the repo's 10 GB
      # Actions-cache quota; the HuggingFace download costs ~2-3 min.
      - name: Download smoke model fixture
        run: |
          mkdir -p smoke-model
          curl -fL --retry 3 -o smoke-model/gemma-4-E4B-it.litertlm \
            https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm

      - name: local_llm_smoke (on-device streaming regression)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo run --example local_llm_smoke --features litert -- ${{ github.workspace }}/smoke-model/gemma-4-E4B-it.litertlm

      # ── Smoke: Laya zero-shot classifier fixture gate (router layer 1.5).
      #    Validates the Rust host against the shipped 201-row capture:
      #    exact builder ids/markers + argmax parity vs captured logits.
      #    679 MB asset set (wfp16 s256 graph, act head, fp16 table,
      #    tokenizer, calibration), cached between runs.
      - name: Cache laya fixture
        id: laya
        uses: actions/cache@v4
        with:
          path: laya-fixture
          key: laya-multilingual-s256-wfp16-v1

      - name: Download laya fixture
        if: steps.laya.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base=https://huggingface.co/litert-community/Laya-Multilingual-LiteRT/resolve/main
          mkdir -p laya-fixture/fixtures
          for f in laya_ml_s256_embeds_wfp16.tflite laya_ml_act_head_fp32.tflite \
                   token_embeddings_fp16.bin tokenizer.json tokenizer_config.json \
                   laya_ml_calibration.json fixtures/gate_rows_s256.json; do
            curl -fL --retry 3 -o "laya-fixture/$f" "$base/$f"
          done

      - name: laya_smoke (classifier fixture gate)
        working-directory: cognee-litert-lm
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/cognee-litert-lm/native
        run: cargo run --release --example laya_smoke --features laya -- ${{ github.workspace }}/laya-fixture

      # ── Smoke 2 + 3: hybrid cloud tier. The zai key comes from the compiled
      #    kawai-vault constants (cargo git dep — authenticated via the PAT
      #    rewrite above), so no extra secrets. Data goes to /tmp.
      - name: remote_smoke (cloud streaming + usage)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo run --example remote_smoke --features litert

      - name: draft_smoke (cloud → docx artifact + receipt)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo run --example draft_smoke --features litert

      # ── Smoke 3b: planner quality. Cloud-only — no on-device model. Runs
      #    the production supervisor planner (build_supervisor_registry +
      #    plan_task) for a few multi-step goals and validates each returned
      #    TaskPlan structurally (steps, tool names, shape).
      - name: planner_smoke (supervisor planner quality)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          KAWAI_BINANCE_REST_BASE: https://data-api.binance.vision
          # NEVER sync the tool catalog from CI (syncs-quota drain): the
          # planner reads the cached replica above; a cache miss degrades to
          # core tools, which this smoke tolerates (structural validation).
          KAWAI_TOOL_CATALOG_OFFLINE: "1"
          # Dump up to 8k chars of any off-protocol planner reply — a
          # recurring protocol drift (2026-10-25, 2026-10-26) is otherwise
          # undebuggable from the 160-char excerpt alone.
          KAWAI_PLANNER_DEBUG: "1"
        run: cargo run --example planner_smoke --features litert,binance

      

      # ── Smoke 4 (macOS): keyless Binance market data + TA. Geo-blocked hosts
      #    SKIP (exit 0), not fail — see the example header.
      - name: binance_smoke (keyless market data + TA)
        working-directory: src-tauri
        env:
          KAWAI_BINANCE_REST_BASE: https://data-api.binance.vision
        run: cargo run --example binance_smoke --features binance

      # ── Smoke (offline): analytics agent tools — csv + the xlsx bridge
      #    (typed conversion, sidecar cache) through the office store, on
      #    every OS. No network, no model.
      - name: analytics_smoke (data_schema/data_query + xlsx bridge)
        run: cargo run --example analytics_smoke
        working-directory: src-tauri

  # ── Linux build gate: bazel-built litert-lm + unit tests ────────────────
  # Split from the smokes (2026-10-26): a single job combining cold bazel +
  # 3.5 GB model download + smokes crosses ~45 min, where GitHub-hosted
  # runners get reclaimed ("runner has received a shutdown signal") — and a
  # killed job cancels its cache post-steps, so every retry stayed cold.
  # linux-build saves the dylib cache even when tests fail (save-always),
  # so the expensive artifact is never rebuilt twice.
  linux-build:
    runs-on: ubuntu-22.04
    # Cold-cache `cargo test (litert + office)` alone ran 117 min on a runner
    # before the old 120-min ceiling killed it mid-compile (run 36127357424,
    # 2026-09-25) — unit-test results were lost and every smoke below skipped.
    timeout-minutes: 180
    # CI runners are ephemeral: debuginfo and incremental artifacts lengthen
    # cold Rust builds but do not change the test or smoke binaries' behavior.
    # Keep source locations in normal compiler diagnostics; runtime backtraces
    # are the only intentionally reduced diagnostic detail here.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Default post-if is `success()`: a timed-out run saves no target
          # dir, so the next run recompiles from cold (the 120/150-min loop).
          cache-on-failure: true

      - name: Init submodules (local-llm + cognee-litert-lm + crates + kawai-embedding + office_oxide + kawai-vault)
        run: git submodule update --init --recursive local-llm cognee-litert-lm crates kawai-embedding office_oxide kawai-vault rust-paddle-ocr pdf_oxide

      # ── Cached LiteRT-LM shared-object set (the expensive bazel artifact) ─
      # Same scheme as macos-smoke: keyed on the LiteRT-LM commit, no
      # restore-keys (a partial hit would restore a .so built from different
      # sources). Repo-wide key: the build is skipped when another job or a
      # previous run already produced this exact set.
      - name: LiteRT-LM dylib cache key
        id: litert-lib-key
        run: |
          set -euo pipefail
          echo "sha=$(git -C cognee-litert-lm/vendor/LiteRT-LM rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore litert-lm dylibs
        id: litert-lib
        uses: actions/cache@v4
        with:
          path: cognee-litert-lm/native
          # cache-on-failure: an infra-killed job must still leave the .so set
          # behind, or every retry rebuilds bazel from scratch (the kill loop).
          save-always: true
          key: litert-lib-linux-x86_64-${{ steps.litert-lib-key.outputs.sha }}-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/prebuilt/linux_x86_64/*.so') }}

      # Bazel is only needed on a dylib-cache miss — skip the bazel cache
      # restore and the build together on a hit. Mounted below the submodule
      # init so the WORKSPACE hash in the key actually resolves (the old
      # pre-init position hashed an empty tree → constant key).
      - name: Mount bazel cache
        if: steps.litert-lib.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-linux-x86_64-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/WORKSPACE', 'cognee-litert-lm/vendor/LiteRT-LM/.bazelrc') }}
          restore-keys: bazel-linux-x86_64-

      # Tauri needs GTK/webkit headers; bindgen + bazel need clang-18.
      # clang-18 via apt.llvm.org — ubuntu-22.04 keeps glibc >= 2.35.
      - name: Install system deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libclang-dev
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm18.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 1000
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 1000
          clang --version

      - name: Build litert-lm shared library
        if: steps.litert-lib.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd cognee-litert-lm/vendor/LiteRT-LM
          bazel build //c:litert-lm --config=linux_x86_64 --jobs=6
          mkdir -p ../../native
          cp bazel-bin/c/liblitert-lm.so ../../native/
          # Companion libraries are loaded at engine creation (dlopen of e.g.
          # libGemmaModelConstraintProvider.so); stage them next to the main
          # .so so LD_LIBRARY_PATH=<native> resolves them.
          cp prebuilt/linux_x86_64/*.so ../../native/

      # ── Unit tests ──
      - name: cargo test (litert + office)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LD_LIBRARY_PATH: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo test --features litert --lib

      # ── Unit tests (local-llm: generation gate, FIFO queue, stateless reset) ──
      - name: cargo test (local-llm; generation gate + queue)
        working-directory: local-llm
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LD_LIBRARY_PATH: ${{ github.workspace }}/cognee-litert-lm/native
        run: cargo test --lib

      # agent_eval intentionally does NOT run here: the E4B orchestration
      # quality suites (office + analytics) live in evals.yml on macOS only —
      # same model, CPU inference, OS-independent quality signal. Running the
      # battery per-OS tripled eval cost for no extra signal.

  # ── Linux smokes: platform gate + monad (no macos-smoke duplication) ────
  # Separate job so neither half of the old 47-minute linux-smoke crosses the
  # hosted-runner reclaim window. local_llm_smoke validates THIS platform's
  # bazel-built dylib + engine; monad_wallet_smoke runs only here. The
  # OS-independent smokes (remote, draft, binance, analytics, planner, laya)
  # live in macos-smoke exclusively — duplicating them here burned the job
  # budget (run 40443508677, 2026-10-27). Dylibs come from linux-build's
  # save-always cache.
  linux-smokes:
    needs: linux-build
    runs-on: ubuntu-22.04
    # The old 6-smoke set exceeded the old 30-min cap on a slow runner (run
    # 40443508677, 2026-10-27); the trimmed two-smoke set leaves ample
    # headroom — kept generous because the model download alone is 3.5 GB.
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Init submodules (local-llm + cognee-litert-lm + crates + kawai-embedding + office_oxide + kawai-vault)
        run: git submodule update --init --recursive local-llm cognee-litert-lm crates kawai-embedding office_oxide kawai-vault rust-paddle-ocr pdf_oxide

      - name: LiteRT-LM dylib cache key
        id: litert-lib-key
        run: |
          set -euo pipefail
          echo "sha=$(git -C cognee-litert-lm/vendor/LiteRT-LM rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore litert-lm dylibs
        id: litert-lib
        uses: actions/cache@v4
        with:
          path: cognee-litert-lm/native
          save-always: true
          key: litert-lib-linux-x86_64-${{ steps.litert-lib-key.outputs.sha }}-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/prebuilt/linux_x86_64/*.so') }}

      # Same link/bindgen toolchain as linux-build — the smoke binaries link
      # the kawai lib (litert + monad features).
      - name: Install system deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libclang-dev
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm18.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 1000
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 1000

      # ── Smoke 1: on-device streaming ──
      # The 3.5 GB fixture downloads per run, NOT cached: the repo's 10 GB
      # Actions-cache quota was thrashing (~12 GB demanded), which evicted the
      # litert dylibs within hours — linux-build rebuilt bazel nearly every
      # run and this job re-downloaded the model anyway (run 40443508677).
      # Freeing 3.5 GB lets the small high-value caches (dylibs, bazel, rust)
      # survive; the HuggingFace download costs ~2-3 min against a 45-min
      # budget.
      - name: Download smoke model fixture
        run: |
          mkdir -p smoke-model
          curl -fL --retry 3 -o smoke-model/gemma-4-E4B-it.litertlm \
            https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm

      - name: local_llm_smoke (on-device streaming regression)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LD_LIBRARY_PATH: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          # All three Linux kills (2026-10-25/26) landed ~20s after the first
          # generated token — workload-correlated, Linux-only (macOS passes
          # with the same model). Prime suspect: KV allocation for the full
          # 16384 budget on a 16 GB ubuntu runner. Quarter the budget here;
          # the 2048-token generation never approaches it.
          KAWAI_LLM_MAX_TOKENS: "4096"
        run: cargo run --example local_llm_smoke --features litert -- ${{ github.workspace }}/smoke-model/gemma-4-E4B-it.litertlm

      # remote_smoke / draft_smoke / binance_smoke / analytics_smoke run in
      # macos-smoke only — they are OS-independent (cloud HTTP, pure-Rust
      # engines) and duplicating them here burned the job budget (the
      # 2026-10-27 timeout kill). Linux keeps the platform-specific gate
      # (local_llm above) and the one smoke macos-smoke does not have:
      # ── Smoke 2 (Linux): Monad wallet — read-only chain probes ──────
      #    Public-RPC reads only (no keychain, no tx); the example's
      #    --with-wallet / --self-transfer flags stay local-only.
      - name: monad_wallet_smoke (read-only Monad chain probes)
        working-directory: src-tauri
        run: cargo run --example monad_wallet_smoke --features monad

  # Hosted-runner reclaims killed linux-smoke twice in two days (~47min in,
  # "The runner has received a shutdown signal" — community discussion 209375;
  # not a concurrency cancel and not a test failure). This job inspects the
  # failed jobs' logs and retries ONLY when the infra-kill signature is
  # present. A genuine test failure reruns NOTHING and stays red immediately.
  auto-rerun:
    needs: [web, linux-check, android-check, macos-smoke, linux-build, linux-smokes]
    # cancelled() is required: a runner-shutdown kill concludes the run
    # "cancelled", not "failure".
    if: (failure() || cancelled()) && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rerun only runner-shutdown kills
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          infra_killed=0
          for job_id in $(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest" \
              --jq '.jobs[] | select(.conclusion == "failure") | .id'); do
            if gh api "repos/$REPO/actions/jobs/$job_id/logs" 2>/dev/null \
               | grep -qi "runner has received a shutdown signal"; then
              echo "job $job_id: infra kill (runner shutdown)"
              infra_killed=1
            else
              echo "job $job_id: real failure — not retrying"
            fi
          done
          if [ "$infra_killed" = "1" ]; then
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
          else
            echo "All failures are real; staying red."
          fi
