name: ci

# Regression gates (AGENTS.md "Verify before considering work done" + Roadmap
# MVP 3): unit tests, the on-device streaming smoke (small 270M fixture), the
# hybrid-tier cloud smokes, and agent_eval (E4B orchestration-quality gate) —
# on every push to main and every PR. litert-dependent smokes run on all three
# desktop platforms (macOS arm64, Linux x86_64, Windows x86_64) — each job
# bazel-builds the LiteRT-LM C engine natively before exercising the full
# smoke suite.
#
# release.yml (app bundles) stays separate; this workflow gates merges.
# NOTE: every push to main (including the release bot's bump commits) runs
# here too — the bazel cache makes that cheap after the first run.
#
# agent_smoke (the full local→cloud turn) is intentionally NOT run here: it
# needs interactive cloud-side state beyond the smokes. Run it manually
# (see its header comment) before tagging a release.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast gate: frontend + web feature (no C toolchain) ────────────────────
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - name: Build frontend (tsc -b + vite)
        run: bun run build

      # Cargo parses local-llm's and cognee-litert-lm's manifests even without
      # the litert feature (optional deps still resolve) — the dirs must
      # exist. local-llm path-deps rig-components tools; office needs
      # office_oxide. Shallow, non-recursive: manifests only, no C sources.
      - name: Init submodules (manifest only)
        run: git submodule update --init local-llm cognee-litert-lm rig-components kawai-embedding rig-libsql office_oxide

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The kawai lib crate depends on tauri unconditionally (glib-sys et al.
      # need the GTK/webkit dev headers even when checking only kawai-web).
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: cargo check (web feature; axum must compile here)
        run: cargo check --features web
        working-directory: src-tauri

  # ── Linux desktop gate: litert + office features compile on Linux ────────
  linux-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      # Recursive: the litert feature runs bindgen, which parses the C headers
      # of the NESTED submodule cognee-litert-lm/vendor/LiteRT-LM.
      - name: Init submodules (recursive — bindgen needs nested LiteRT-LM headers)
        run: git submodule update --init --recursive local-llm cognee-litert-lm rig-components kawai-embedding rig-libsql office_oxide

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri needs GTK/webkit headers; bindgen (litert feature) needs libclang.
      # clang-18 NOT needed here — cargo check doesn't build the LiteRT-LM C
      # library (bindgen only parses the C headers via libclang).
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libclang-dev

      - name: cargo check (litert + office; desktop feature set)
        run: cargo check --features litert,office
        working-directory: src-tauri

      # Binance agent tools: keyless, no C deps — a plain compile gate is enough.
      # The webread combo covers the binance-agent web_read/web_search reuse
      # path in logic::agent::toolset_for.
      - name: cargo check (binance feature)
        run: cargo check --features binance
        working-directory: src-tauri

      - name: cargo check (binance + webread)
        run: cargo check --features binance,webread
        working-directory: src-tauri

      # Data analysis agent: polars + office_oxide xlsx bridge — pure Rust,
      # plain compile gate + the crate's unit tests (AST translation, dtype
      # coercion, sidecar cache; fixture parquet/csv/xlsx built in-test).
      - name: cargo check (analytics feature)
        run: cargo check --features analytics
        working-directory: src-tauri

      - name: cargo test (rig-components/analytics)
        run: cargo test -p analytics
        working-directory: rig-components

      # Webread crate: engine-chain unit tests — html-to-markdown-rs render,
      # {t,x,h} payload split, plain-text fallback, search relevance gate.
      - name: cargo test (rig-components/webread)
        run: cargo test -p webread
        working-directory: rig-components

      # The tier-0 extractor JS must stay parseable — a syntax error fails
      # SILENTLY (eval never returns a payload → every read falls through to
      # Cloudflare). Node parses the const and checks the payload shape; no
      # DOM here, so the catch path ({t,x,e}) is the expected outcome.
      - name: webview EXTRACTOR JS sanity (parse + JSON shape)
        run: |
          python3 - <<'EOF'
          import re
          src = open('src-tauri/src/webview_engine.rs').read()
          m = re.search(r'const EXTRACTOR: &str = r#"(.*?)"#;', src, re.S)
          open('/tmp/extractor.js', 'w').write(
              "const out = (" + m.group(1) + ");\n"
              + "const p = JSON.parse(out);\n"
              + "if (!('x' in p)) { throw new Error('payload missing x'); }\n"
              + "console.log('extractor ok');\n")
          EOF
          node /tmp/extractor.js

  # ── Full gate: unit tests + on-device smoke + hybrid cloud smokes ─────────
  macos-smoke:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Key is per-runner-generation: objects built against an older Xcode's
      # libc++ headers must not be reused after a toolchain jump (same as
      # release.yml build-macos).
      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            /private/var/tmp/_bazel_runner
          key: bazel-macos26-arm64-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/MODULE.bazel') }}
          restore-keys: bazel-macos26-arm64-

      - name: Init submodules (local-llm + cognee-litert-lm + rig-components + kawai-embedding + rig-libsql + office_oxide)
        run: git submodule update --init --recursive local-llm cognee-litert-lm rig-components kawai-embedding rig-libsql office_oxide

      - name: Build litert-lm dylib
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_arm64"
          cd cognee-litert-lm/vendor/LiteRT-LM
          bazel build //c:litert-lm --config=macos_arm64 --jobs=6
          mkdir -p ../../native
          cp bazel-bin/c/liblitert-lm.dylib ../../native/
          install_name_tool -id @rpath/liblitert-lm.dylib ../../native/liblitert-lm.dylib
          bash ../../../scripts/bundle-litert-dylibs.sh

      # ── Unit tests (41: fence parsing, transcript compaction, draft JSON,
      #    ooxml round-trips, rag FTS mirror …) ──
      - name: cargo test (litert + office)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo test --features litert,office --lib

      # ── Smoke 1: on-device streaming (Roadmap MVP 3). Small public fixture:
      #    litert-community/LFM2.5-1.2B-Instruct · int8 · 1.25 GB. The previous
      #    fixture (gemma-3-270m-it q8) went gated=auto on HF — anonymous CI
      #    downloads 401. Cached between runs.
      - name: Cache smoke model fixture
        id: model
        uses: actions/cache@v4
        with:
          path: smoke-model
          key: lfm25-1p2b-instruct-int8-litertlm

      - name: Download smoke model fixture
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p smoke-model
          curl -fL --retry 3 -o smoke-model/lfm2.5-1.2b-instruct-int8.litertlm \
            https://huggingface.co/litert-community/LFM2.5-1.2B-Instruct/resolve/main/LFM2.5-1.2B-Instruct_int8.litertlm

      - name: local_llm_smoke (on-device streaming regression)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo run --example local_llm_smoke --features litert -- ${{ github.workspace }}/smoke-model/lfm2.5-1.2b-instruct-int8.litertlm

      # ── Smoke 2 + 3: hybrid cloud tier. The zai key comes from the compiled
      #    kawai-vault constants (cargo git dep — authenticated via the PAT
      #    rewrite above), so no extra secrets. Data goes to /tmp.
      - name: remote_smoke (cloud streaming + usage)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          KAWAI_DATA_DIR: /tmp/kawai-ci
        run: cargo run --example remote_smoke --features litert

      - name: draft_smoke (cloud → docx artifact + receipt)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          KAWAI_DATA_DIR: /tmp/kawai-ci
        run: cargo run --example draft_smoke --features litert,office

      # ── Smoke 4 (macOS): keyless Binance market data + TA. Geo-blocked hosts
      #    SKIP (exit 0), not fail — see the example header.
      - name: binance_smoke (keyless market data + TA)
        working-directory: src-tauri
        env:
          KAWAI_BINANCE_REST_BASE: https://data-api.binance.vision
        run: cargo run --example binance_smoke --features binance

      # ── Smoke (offline): analytics agent tools — csv + the xlsx bridge
      #    (typed conversion, sidecar cache) through the office store, on
      #    every OS. No network, no model.
      - name: analytics_smoke (data_schema/data_query + xlsx bridge)
        run: cargo run --example analytics_smoke --features analytics
        working-directory: src-tauri

      # ── Smoke (macOS): tier-0 web_read chain end-to-end — real hidden
      #    WKWebView window, extractor payload probe, Rust-side markdown
      #    render. Strict mode: engine MUST be webview/cache (a regression
      #    falls through to Cloudflare and would otherwise pass silently).
      - name: web_read_check (tier-0 webview chain)
        run: cargo run --example web_read_check --features office
        working-directory: src-tauri
        env:
          KAWAI_WEB_READ_REQUIRE_TIER0: "1"

      # ── Smoke 5: orchestration-quality gate (PLAN H1/L12). 20 office
      #    scenarios against E4B, scored on tool selection + arguments.
      #    Gate 19/20 (temp=1.0 sampling allows a one-scenario flake; a real
      #    regression fails 2+). Report lands in the job summary + artifact.
      #    K/V budget 8192: eval prompts are ~2k tokens, this halves peak RSS
      #    vs the 16384 desktop default (runner has 14GB).
      - name: Cache E4B eval model
        id: eval-model
        uses: actions/cache@v4
        with:
          path: eval-model
          key: gemma-4-E4B-it-litertlm

      - name: Download E4B eval model
        if: steps.eval-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p eval-model
          curl -fL --retry 3 -o eval-model/gemma-4-E4B-it.litertlm \
            https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm

      - name: agent_eval (orchestration quality gate + report)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          KAWAI_DATA_DIR: /tmp/kawai-ci
          KAWAI_LLM_MAX_TOKENS: "8192"
          EVAL_MIN_PASS: "19"
        run: |
          cargo run --release --example agent_eval --features litert,office -- \
            ${{ github.workspace }}/eval-model/gemma-4-E4B-it.litertlm \
            ${{ github.workspace }}/agent-eval-report.md
          cat ${{ github.workspace }}/agent-eval-report.md >> "$GITHUB_STEP_SUMMARY"

      # ── Analytics suite (EVAL_SUITE=analytics): data_schema/data_query
      #    selection + argument composition over a stated schema. Gate 7/8 —
      #    temp sampling allows one flake. macOS-only: the office suite
      #    already gates the model on all three runners.
      - name: agent_eval (analytics suite)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          KAWAI_DATA_DIR: /tmp/kawai-ci
          KAWAI_LLM_MAX_TOKENS: "8192"
          EVAL_SUITE: analytics
          EVAL_MIN_PASS: "7"
        run: |
          cargo run --release --example agent_eval --features litert,office -- \
            ${{ github.workspace }}/eval-model/gemma-4-E4B-it.litertlm \
            ${{ github.workspace }}/agent-eval-report-analytics.md
          cat ${{ github.workspace }}/agent-eval-report-analytics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report
          path: agent-eval-report.md
          if-no-files-found: warn

      - name: Upload analytics eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-analytics
          path: agent-eval-report-analytics.md
          if-no-files-found: warn

  # ── Linux full gate: bazel-built litert-lm + unit tests + all smokes ─────
  linux-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-linux-x86_64-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/MODULE.bazel') }}
          restore-keys: bazel-linux-x86_64-

      - name: Init submodules (local-llm + cognee-litert-lm + rig-components + kawai-embedding + rig-libsql + office_oxide)
        run: git submodule update --init --recursive local-llm cognee-litert-lm rig-components kawai-embedding rig-libsql office_oxide

      # Tauri needs GTK/webkit headers; bindgen + bazel need clang-18.
      # clang-18 via apt.llvm.org — ubuntu-22.04 keeps glibc >= 2.35.
      - name: Install system deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libclang-dev
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm18.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 1000
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 1000
          clang --version

      - name: Build litert-lm shared library
        run: |
          set -euo pipefail
          cd cognee-litert-lm/vendor/LiteRT-LM
          bazel build //c:litert-lm --config=linux_x86_64 --jobs=6
          mkdir -p ../../native
          cp bazel-bin/c/liblitert-lm.so ../../native/
          # Companion libraries are loaded at engine creation (dlopen of e.g.
          # libGemmaModelConstraintProvider.so); stage them next to the main
          # .so so LD_LIBRARY_PATH=<native> resolves them.
          cp prebuilt/linux_x86_64/*.so ../../native/

      # ── Unit tests ──
      - name: cargo test (litert + office)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LD_LIBRARY_PATH: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo test --features litert,office --lib

      # ── Smoke 1: on-device streaming ──
      - name: Cache smoke model fixture
        id: model
        uses: actions/cache@v4
        with:
          path: smoke-model
          key: lfm25-1p2b-instruct-int8-litertlm

      - name: Download smoke model fixture
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p smoke-model
          curl -fL --retry 3 -o smoke-model/lfm2.5-1.2b-instruct-int8.litertlm \
            https://huggingface.co/litert-community/LFM2.5-1.2B-Instruct/resolve/main/LFM2.5-1.2B-Instruct_int8.litertlm

      - name: local_llm_smoke (on-device streaming regression)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LD_LIBRARY_PATH: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo run --example local_llm_smoke --features litert -- ${{ github.workspace }}/smoke-model/lfm2.5-1.2b-instruct-int8.litertlm

      # ── Smoke 2 + 3: hybrid cloud tier ──
      - name: remote_smoke (cloud streaming + usage)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LD_LIBRARY_PATH: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          KAWAI_DATA_DIR: /tmp/kawai-ci
        run: cargo run --example remote_smoke --features litert

      - name: draft_smoke (cloud → docx artifact + receipt)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LD_LIBRARY_PATH: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          KAWAI_DATA_DIR: /tmp/kawai-ci
        run: cargo run --example draft_smoke --features litert,office

      # ── Smoke 4 (Linux): keyless Binance market data + TA ──
      - name: binance_smoke (keyless market data + TA)
        working-directory: src-tauri
        env:
          KAWAI_BINANCE_REST_BASE: https://data-api.binance.vision
        run: cargo run --example binance_smoke --features binance

      # ── Smoke (offline): analytics agent tools — csv + the xlsx bridge
      #    (typed conversion, sidecar cache) through the office store, on
      #    every OS. No network, no model.
      - name: analytics_smoke (data_schema/data_query + xlsx bridge)
        run: cargo run --example analytics_smoke --features analytics
        working-directory: src-tauri

      # ── Smoke 5: orchestration-quality gate ──
      - name: Cache E4B eval model
        id: eval-model
        uses: actions/cache@v4
        with:
          path: eval-model
          key: gemma-4-E4B-it-litertlm

      - name: Download E4B eval model
        if: steps.eval-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p eval-model
          curl -fL --retry 3 -o eval-model/gemma-4-E4B-it.litertlm \
            https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm

      - name: agent_eval (orchestration quality gate + report)
        working-directory: src-tauri
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/cognee-litert-lm/native
          LD_LIBRARY_PATH: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          KAWAI_DATA_DIR: /tmp/kawai-ci
          KAWAI_LLM_MAX_TOKENS: "8192"
          EVAL_MIN_PASS: "19"
        run: |
          cargo run --release --example agent_eval --features litert,office -- \
            ${{ github.workspace }}/eval-model/gemma-4-E4B-it.litertlm \
            ${{ github.workspace }}/agent-eval-report-linux.md
          cat ${{ github.workspace }}/agent-eval-report-linux.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-linux
          path: agent-eval-report-linux.md
          if-no-files-found: warn

  # ── Windows full gate: bazel-built litert-lm + unit tests + all smokes ──
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-windows-x86_64-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/MODULE.bazel') }}
          restore-keys: bazel-windows-x86_64-

      - name: Init submodules (local-llm + cognee-litert-lm + rig-components + kawai-embedding + rig-libsql + office_oxide)
        shell: bash
        run: git submodule update --init --recursive local-llm cognee-litert-lm rig-components kawai-embedding rig-libsql office_oxide

      - name: Install bazelisk
        shell: pwsh
        run: choco install bazelisk --confirm --no-progress

      # Upstream ml-ci-build-win recipe: the runner's TEMP is the 8.3 short
      # form — rustc's msvc link inside bazel fails there (LNK1181 on .rcgu.o).
      - name: Remap TMP/TEMP for rustc/msvc linking
        shell: pwsh
        run: |
          $newTemp = "C:\_w\_tmp"
          New-Item -ItemType Directory -Path $newTemp -Force | Out-Null
          "TMP=$newTemp" >> $env:GITHUB_ENV
          "TEMP=$newTemp" >> $env:GITHUB_ENV

      - name: Build litert-lm shared library
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
          ANDROID_NDK_HOME: ""
        run: |
          set -euo pipefail
          cd cognee-litert-lm/vendor/LiteRT-LM
          bazel --output_base=C:/_b build //c:litert-lm --config=windows \
            --jobs=4 --action_env=TMP --action_env=TEMP
          BZ_BIN="$(bazel --output_base=C:/_b info bazel-bin)"
          mkdir -p ../../native
          cp "$BZ_BIN/c/litert-lm.dll" ../../native/
          # MSVC link emits the DLL's import library under bazel's interface
          # library name <target>.if.lib; rustc -llitert-lm searches for
          # litert-lm.lib — normalize the name on copy.
          if [ -f "$BZ_BIN/c/litert-lm.if.lib" ]; then
            cp "$BZ_BIN/c/litert-lm.if.lib" ../../native/litert-lm.lib
          else
            cp "$BZ_BIN/c/litert-lm.lib" ../../native/litert-lm.lib
          fi
          # Companion DLLs are load-time dependencies of litert-lm.dll (e.g.
          # libGemmaModelConstraintProvider.dll); stage them next to the main
          # DLL so PATH-based loading resolves them.
          cp prebuilt/windows_x86_64/*.dll ../../native/

      # Expose the staged DLLs to the test/smoke binaries WITHOUT clobbering
      # PATH: a step-env `PATH:` override replaces the runner PATH entirely
      # (`${{ env.PATH }}` is empty in workflow-file context, which erases
      # cargo). GITHUB_PATH appends persist and merge with the runner PATH.
      - name: Add native dir to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ github.workspace }}\cognee-litert-lm\native"

      # ── Unit tests ──
      - name: cargo test (litert + office)
        working-directory: src-tauri
        shell: bash
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo test --features litert,office --lib

      # ── Smoke 1: on-device streaming ──
      - name: Cache smoke model fixture
        id: model
        uses: actions/cache@v4
        with:
          path: smoke-model
          key: lfm25-1p2b-instruct-int8-litertlm

      - name: Download smoke model fixture
        if: steps.model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p smoke-model
          curl -fL --retry 3 -o smoke-model/lfm2.5-1.2b-instruct-int8.litertlm \
            https://huggingface.co/litert-community/LFM2.5-1.2B-Instruct/resolve/main/LFM2.5-1.2B-Instruct_int8.litertlm

      - name: local_llm_smoke (on-device streaming regression)
        working-directory: src-tauri
        shell: bash
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo run --example local_llm_smoke --features litert -- ${{ github.workspace }}/smoke-model/lfm2.5-1.2b-instruct-int8.litertlm

      # ── Smoke 2 + 3: hybrid cloud tier ──
      - name: remote_smoke (cloud streaming + usage)
        working-directory: src-tauri
        shell: bash
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          KAWAI_DATA_DIR: ${{ runner.temp }}/kawai-ci
        run: cargo run --example remote_smoke --features litert

      - name: draft_smoke (cloud → docx artifact + receipt)
        working-directory: src-tauri
        shell: bash
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          KAWAI_DATA_DIR: ${{ runner.temp }}/kawai-ci
        run: cargo run --example draft_smoke --features litert,office

      # ── Smoke 4 (Windows): keyless Binance market data + TA ──
      - name: binance_smoke (keyless market data + TA)
        working-directory: src-tauri
        env:
          KAWAI_BINANCE_REST_BASE: https://data-api.binance.vision
        shell: bash
        run: cargo run --example binance_smoke --features binance

      # ── Smoke (offline): analytics agent tools — csv + the xlsx bridge
      #    (typed conversion, sidecar cache) through the office store, on
      #    every OS. No network, no model.
      - name: analytics_smoke (data_schema/data_query + xlsx bridge)
        run: cargo run --example analytics_smoke --features analytics
        working-directory: src-tauri

      # ── Smoke 5: orchestration-quality gate ──
      - name: Cache E4B eval model
        id: eval-model
        uses: actions/cache@v4
        with:
          path: eval-model
          key: gemma-4-E4B-it-litertlm

      - name: Download E4B eval model
        if: steps.eval-model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p eval-model
          curl -fL --retry 3 -o eval-model/gemma-4-E4B-it.litertlm \
            https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm

      - name: agent_eval (orchestration quality gate + report)
        working-directory: src-tauri
        shell: bash
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          KAWAI_DATA_DIR: ${{ runner.temp }}/kawai-ci
          KAWAI_LLM_MAX_TOKENS: "8192"
          EVAL_MIN_PASS: "19"
        run: |
          cargo run --release --example agent_eval --features litert,office -- \
            ${{ github.workspace }}/eval-model/gemma-4-E4B-it.litertlm \
            ${{ github.workspace }}/agent-eval-report-windows.md
          cat ${{ github.workspace }}/agent-eval-report-windows.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-windows
          path: agent-eval-report-windows.md
          if-no-files-found: warn
