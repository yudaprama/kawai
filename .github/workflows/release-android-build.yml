name: release-android-build

# Reusable Android release build — ONE variant per call, invoked twice by
# release-android.yml:
#   • variant=qris  — features `release-android`,  APK only, attached to the
#     GitHub release (sideload distribution; QRIS top-up UI).
#   • variant=play  — features `release-android-play` (= release-android +
#     `iap`), AAB → Play internal track (+ APK as a run artifact for manual
#     testing; Google Play Billing top-up UI, no QRIS/voucher).
#
# The platform difference lives inside lonkero, not in the feature list: no
# Chromium executable exists in the Android app sandbox (Chrome ships as an
# APK; targetSdk 29+ forbids exec from writable dirs), so its headless-Chrome
# paths are compile-time excluded. `litert` is why this builds aarch64 ONLY:
# the LiteRT-LM C library is built for android_arm64
# (`bazel build //c:litert-lm --config=android_arm64`, staged into jniLibs by
# scripts/stage-litert-android.sh) and armeabi-v7a can neither link it nor fit
# a GB-scale model in a 32-bit address space. Every Android phone that can run
# API 24+ from the last decade is arm64-capable; Play requires 64-bit anyway.
#
# On-device inference also needs a `.litertlm` model file in <app_data>/models
# — no model ships inside the APK (same as the desktop bundles).
#
# The `iap` feature additionally compiles tauri-plugin-iap (Google Play
# Billing Library v9 via the plugin's Kotlin module) and registers its
# capability: the build's --config merge REPLACES app.security.capabilities
# with [default, iap] — builds without the merge never parse the plugin's
# capability file, so tauri-build never resolves a permission whose plugin is
# absent.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (vMAJOR.MINOR.PATCH).'
        required: true
        type: string
      version_code:
        description: 'Android versionCode (10000 + the PARENT run_number, so both variants of one release share it). STRING, not number: GitHub silently drops the child run when a needs.* string output is passed to a number-typed workflow_call input; the use sites fromJSON() it back into a real JSON number.'
        required: true
        type: string
      variant:
        description: 'qris | play — selects the config merge and upload steps.'
        required: true
        type: string
      features:
        description: 'Cargo feature set (release-android | release-android-play).'
        required: true
        type: string
      build_aab:
        description: 'Build the signed AAB (Play submission format).'
        required: true
        type: boolean
      build_apk:
        description: 'Build the universal APK (native/R8 verification runs on it).'
        required: true
        type: boolean
      attach_release:
        description: 'Attach the APK to the GitHub release draft.'
        required: true
        type: boolean
      upload_play:
        description: 'Upload the AAB to the Play internal track (gated on signing + PLAY_UPLOAD_ENABLED).'
        required: true
        type: boolean
      loki_level:
        description: 'KAWAI_LOKI_LEVEL baked at compile time (off|error|warn|info|debug|trace).'
        required: false
        type: string
        default: 'warn'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve variant inputs
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${{ inputs.tag }}' is not vMAJOR.MINOR.PATCH — cannot set versionName." >&2
            exit 1
          fi
          echo "Building variant=${{ inputs.variant }} features=${{ inputs.features }} for ${{ inputs.tag }} (versionName $VERSION, versionCode ${{ inputs.version_code }})."

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          token: ${{ secrets.RELEASE_TOKEN }}
          # Private submodules (office_oxide, pdf_oxide, kawai-vault, …) are
          # path/git dependencies of src-tauri's default `desktop` feature —
          # the release token above authenticates the fetches.
          submodules: recursive
          # LiteRT-LM's Android linker input is LFS-managed in a nested
          # submodule; without this it is checked out as a text pointer.
          lfs: true

      - name: Verify LiteRT-LM Android library
        run: |
          set -euo pipefail
          library=cognee-litert-lm/vendor/LiteRT-LM/prebuilt/android_arm64/libGemmaModelConstraintProvider.so
          test -s "$library"
          if [ "$(wc -c < "$library")" -le 1000000 ]; then
            echo "::error::$library is unexpectedly small; Git LFS content was not fetched."
            exit 1
          fi
      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The runner's preinstalled cmdline-tools (16.0) cannot parse the
          # SDK XML v4 repository, so minor-versioned platforms like
          # 'platforms;android-37.0' are invisible to it. Install
          # cmdline-tools;latest first (old-format package, always
          # resolvable), then install the rest with the new sdkmanager.
          packages: 'cmdline-tools;latest'

      - name: Install SDK packages (API 37.0, build-tools 37, NDK 28)
        run: |
          set -euo pipefail
          # A preinstalled cmdline-tools;latest makes the action install the
          # new one as 'latest-2' — always pick the newest by version sort.
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/latest*/bin/sdkmanager | sort -V | tail -n1)"
          # compileSdk/targetSdk 37 + NDK 28 match src-tauri/gen/android.
          # API 37's platform package is 'android-37.0' (minor-versioned
          # naming); 'platforms;android-37' does not exist. NDK 28.0.13004158
          # was never published — 28.2.13676358 is the newest stable 28.x.
          # One package per argument; 'yes || true' because closing the pipe
          # SIGPIPEs it once licenses are all accepted.
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"
          # The LiteRT-LM bazel build (androidndk rule) and cognee-litert-lm's
          # build.rs both resolve the NDK from ANDROID_NDK_HOME.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # The security feature's vendored OpenSSL build (lonkero → native-tls →
      # openssl-sys) runs `make` with binutils resolved by the cc crate. tauri's
      # android toolchain wires CC/AR but not RANLIB, and cc's fallback is the
      # bare cross-prefix name (`aarch64-linux-android-ranlib`), which the NDK
      # does not ship (it has `llvm-ranlib`) — make dies with "not found".
      # Export the cc-crate env vars explicitly, exactly what cargo-ndk does
      # (the cargo-ndk-based CI checks pass for this reason).
      - name: Export NDK binutils for cc-crate builds (vendored OpenSSL)
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$BIN/llvm-ranlib"
          } >> "$GITHUB_ENV"

      # cargo-mobile2 force-symlinks the NDK sysroot's libc++_shared.so into
      # jniLibs on EVERY rust build (src/android/jnilibs.rs symlink_lib — no
      # existence check), so it can replace a stripped copy with an unstripped
      # symlink between the Gradle strip task and packaging. Strip the symlink
      # TARGET instead: then any symlink cargo-mobile2 creates points at
      # already-stripped bytes, whatever the task ordering. It picks the
      # NEWEST installed NDK itself (ignores ANDROID_NDK_HOME), so strip every
      # NDK's sysroot. --strip-unneeded keeps .dynsym (the linker and dlopen
      # only need dynamic symbols).
      - name: Strip NDK runtime libc++ (symlink source of jniLibs copy)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:?ANDROID_HOME is unset}"
          STRIP="$(ls "$SDK"/ndk/*/toolchains/llvm/prebuilt/*/bin/llvm-strip 2>/dev/null | head -n1 || true)"
          if [ -z "$STRIP" ]; then echo "::error::no llvm-strip under $SDK/ndk"; exit 1; fi
          found=0
          for lib in "$SDK"/ndk/*/toolchains/llvm/prebuilt/*/sysroot/usr/lib/*/libc++_shared.so; do
            [ -f "$lib" ] || continue
            "$STRIP" --strip-unneeded "$lib"
            echo "stripped $lib"
            found=1
          done
          [ "$found" = 1 ] || { echo "::error::no libc++_shared.so found under $SDK/ndk"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── LiteRT-LM C library (android_arm64) ─────────────────────────────
      # Same bazel source as the desktop release, different config. Bazelisk
      # honors the vendored .bazelversion pin so this matches upstream.
      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-linux-android_arm64-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/WORKSPACE', 'cognee-litert-lm/vendor/LiteRT-LM/.bazelrc') }}
          restore-keys: bazel-linux-android_arm64-

      - name: Install bazelisk
        run: |
          # GitHub-hosted runners intermittently time out on github release
          # downloads (v0.3.80 lost two runs: a Maven 504 and this step's
          # bare wget exiting 4 after 2.5 min of silence).
          sudo wget -q --tries=10 --timeout=30 --waitretry=5 -O /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazelisk
          bazelisk version

      # The .so and its companions land in native/aarch64-linux-android — the
      # link dir cognee-litert-lm's build.rs infers for this target — and are
      # then packed into jniLibs so the Android linker resolves them from the
      # app's nativeLibraryDir at load time (both the link and the runtime half
      # of the litert feature). The two variant jobs share this cache key, so
      # whichever finishes first warms it for the other.
      - name: Build litert-lm for Android (arm64)
        run: |
          set -euo pipefail
          cd cognee-litert-lm/vendor/LiteRT-LM
          # -z max-page-size=16384: Google Play requires all native libs in
          # updates targeting Android 15+ to be 16 KB aligned (ELF LOAD
          # p_align); the default lld page size here is 4 KB and Play rejects
          # the AAB with a bare "Validation of uploaded file failed."
          # -soname: the Linux/Android link branch passes
          # c/litert_lm_c_api_linux.lds, a VERSION SCRIPT, so the library
          # exports a versioned symbol node (LITERT_LM_C_API_1.0). Every
          # consumer then records a DT_VERNEED entry naming liblitert-lm.so,
          # and bionic resolves that name against the loaded dependency's
          # DT_SONAME (linker.cpp VersionTracker::init_verneed). With no
          # DT_SONAME the soname is "" and dlopen of libkawai_lib.so dies at
          # launch with `cannot find "liblitert-lm.so" from verneed[0] in
          # DT_NEEDED list` — an instant crash, before any Rust code runs.
          bazelisk build //c:litert-lm --config=android_arm64 --jobs=6 \
            --linkopt=-Wl,-soname,liblitert-lm.so \
            --linkopt=-Wl,-z,max-page-size=16384
          mkdir -p ../../native/aarch64-linux-android
          cp bazel-bin/c/liblitert-lm.so ../../native/aarch64-linux-android/
          cp prebuilt/android_arm64/*.so ../../native/aarch64-linux-android/

      - name: Stage litert libs into jniLibs
        run: bash scripts/stage-litert-android.sh

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret set — release falls back to the debug key (not uploadable to Play)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          # The upload keystore is PKCS12 (kawai-android-upload.p12, alias
          # `upload`): the format has no separate key password — Java derives
          # it from the store password. ANDROID_KEY_PASSWORD is ignored here;
          # passing it as keyPassword makes gradle fail key decryption
          # ("Given final block not properly padded") whenever it differs.
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$STORE_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Play rejects an upload whose versionCode was already used, so it
      # must strictly increase per app — the PARENT run's number is
      # monotonic per repo and independent of the desktop version bump
      # (which can be resumed and re-run at the same tag). Both variants of
      # one release share the code (same parent run): the QRIS APK never
      # touches Play, so only the play variant's uploads consume codes.
      # It rides a `tauri --config` merge on the build commands below:
      # writing gen/android/app/tauri.properties directly here is
      # CLOBBERED — the CLI regenerates that file on every build from its
      # own config (v0.3.36/37 shipped versionCode 3037, the 0.3.37
      # default, with this step's 10045 silently discarded).
      # The play variant's merge ALSO replaces app.security.capabilities
      # with [default, iap] — tauri.conf.json lists only "default", and a
      # build that doesn't compile tauri-plugin-iap would fail capability
      # resolution on the plugin's permissions. Arrays REPLACE wholesale in
      # a config merge, so the play list must be complete here.
      - name: Set Android version (+ IAP capability for the play variant)
        run: |
          set -euo pipefail
          if [ "${{ inputs.variant }}" = "play" ]; then
            cat > "$RUNNER_TEMP/tauri-android-version.json" <<EOF
          {"bundle": {"android": {"versionCode": ${{ fromJSON(inputs.version_code) }}}}, "app": {"security": {"capabilities": ["default", "iap"]}}}
          EOF
          else
            cat > "$RUNNER_TEMP/tauri-android-version.json" <<EOF
          {"bundle": {"android": {"versionCode": ${{ fromJSON(inputs.version_code) }}}}}
          EOF
          fi

      # Dependency downloads (gradle + kotlin toolchain jars) are the other
      # v0.3.80 failure class — a Maven 504 killed the AAB build. One green
      # run fills this cache; later runs resolve locally and never re-fetch.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-android-${{ runner.os }}-v1
          restore-keys: gradle-android-${{ runner.os }}-

      # ── Builds (one tauri invocation per artifact format) ───────────────
      - name: Build signed AAB
        if: ${{ inputs.build_aab }}
        env:
          # Read at compile time (option_env!) — this is how a release APK
          # under test opts into INFO; a phone has no shell to export into.
          KAWAI_LOKI_LEVEL: ${{ inputs.loki_level }}
        run: bun tauri android build --target aarch64 --features ${{ inputs.features }} --config "$RUNNER_TEMP/tauri-android-version.json"

      - name: Build universal APK (native/R8 verification + sideload)
        if: ${{ inputs.build_apk }}
        env:
          KAWAI_LOKI_LEVEL: ${{ inputs.loki_level }}
        run: bun tauri android build --target aarch64 --features ${{ inputs.features }} --apk --config "$RUNNER_TEMP/tauri-android-version.json"

      # Native libraries are stored UNCOMPRESSED in an APK (extractNativeLibs
      # =false) and AGP passes prebuilt jniLibs through untouched, so the Rust
      # .so ships its entire .symtab (~64 MB on arm64) unless
      # stripReleaseNativeLibs in src-tauri/gen/android/app/build.gradle.kts
      # removed it. That task also exports unstripped copies for Play's native
      # debug symbols (crash symbolication); this step proves the packaged libs
      # are stripped, that .dynsym survived the strip, and packages the symbols.
      # Both variants build the APK and run the SAME verification battery on
      # it — the play variant's AAB is validated separately below.
      - name: Verify stripped native libs + package debug symbols
        id: native_symbols
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$NDK" ]; then
            echo "::error::ANDROID_NDK_HOME/ANDROID_NDK_ROOT is unset — cannot verify the packaged native libraries."
            exit 1
          fi
          READELF="$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/llvm-readelf 2>/dev/null | head -n1)"
          NM="$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/llvm-nm 2>/dev/null | head -n1)"
          if [ -z "$READELF" ] || [ -z "$NM" ]; then
            echo "::error::llvm-readelf/llvm-nm not found under $NDK/toolchains/llvm/prebuilt."
            exit 1
          fi
          APK="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          WORK="$(mktemp -d)"
          SOS=()
          while IFS= read -r so; do SOS+=("$so"); done < <(unzip -Z1 "$APK" | grep -E '^lib/.*\.so$')
          if [ "${#SOS[@]}" -eq 0 ]; then
            echo "::error::The APK contains no native libraries — the Rust build did not reach jniLibs."
            exit 1
          fi
          for so in "${SOS[@]}"; do
            out="$WORK/${so//\//_}"
            unzip -p "$APK" "$so" > "$out"
            # Grep files, never a producer pipe: grep -q closes the pipe on
            # the first match and SIGPIPEs the tool, which pipefail reads as
            # a failed check.
            "$READELF" -S "$out" > "$out.sections"
            if grep -q '\.symtab' "$out.sections"; then
              echo "::error::$so still carries .symtab — the packaged library was not stripped (see stripReleaseNativeLibs in src-tauri/gen/android/app/build.gradle.kts)."
              exit 1
            fi
            # Google Play rejects bundles whose native libs are not 16 KB
            # aligned (Android 15+ requirement) with a bare "Validation of
            # uploaded file failed." — catch it here with a precise message.
            ALIGN="$("$READELF" -l "$out" | sed -n 's/.*LOAD.*\(0x[0-9a-f]*\)$/\1/p' | sort -u | head -n1)"
            if [ "$ALIGN" != "0x4000" ]; then
              echo "::error::$so has ELF LOAD alignment $ALIGN — Google Play requires 16 KB (0x4000). Link with -Wl,-z,max-page-size=16384 (see the litert bazel build step)."
              exit 1
            fi
          done
          ARM="$WORK/lib_arm64-v8a_libkawai_lib.so"
          # nm's output is huge; grep -q would close the pipe early and
          # SIGPIPE the producer (pipefail reads that as failure) — dump to a
          # file and grep that instead.
          "$NM" -D --defined-only "$ARM" > "$WORK/kawai.dynsyms"
          grep -q 'Java_pro_kawai_app_Rust_ipc' "$WORK/kawai.dynsyms" ||
            { echo "::error::libkawai_lib.so lost Java_pro_kawai_app_Rust_ipc — the strip removed dynamic symbols."; exit 1; }
          grep -q 'Java_app_tauri_plugin_PluginManager_sendChannelData' "$WORK/kawai.dynsyms" ||
            { echo "::error::libkawai_lib.so lost its Java_* entrypoints — the strip removed dynamic symbols."; exit 1; }
          LM="$WORK/lib_arm64-v8a_liblitert-lm.so"
          if [ -f "$LM" ]; then
            "$NM" -D --defined-only "$LM" > "$WORK/litert.dynsyms"
            grep -q 'litert_lm_engine_create' "$WORK/litert.dynsyms" ||
              { echo "::error::liblitert-lm.so lost the LiteRT C API exports."; exit 1; }
          fi
          SYMBOLS="src-tauri/gen/android/app/build/outputs/native-debug-symbols"
          SYM_LIB="$SYMBOLS/lib/arm64-v8a/libkawai_lib.so"
          "$READELF" -S "$SYM_LIB" > "$WORK/symbols.sections" 2>/dev/null || true
          if [ -f "$SYM_LIB" ] && grep -q '\.symtab' "$WORK/symbols.sections"; then
            ZIP="$RUNNER_TEMP/native-debug-symbols.zip"
            (cd "$SYMBOLS" && zip -qr "$ZIP" lib)
            echo "Native debug symbols: $ZIP ($(du -h "$ZIP" | cut -f1))"
            echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          else
            echo "zip=" >> "$GITHUB_OUTPUT"
            echo "::warning::No unstripped native debug symbols were exported — Play cannot symbolicate native crashes for this build."
          fi

      # The APK dlopen()s its native libs the moment MainActivity starts, so a
      # broken DT_NEEDED/DT_VERNEED graph or an unprovided C++ runtime symbol
      # is an instant crash on a device — and none of the checks above
      # (stripping, alignment, exports) can see it. Two failures shipped this
      # way: liblitert-lm.so exported a versioned symbol node
      # (c/litert_lm_c_api_linux.lds) but carried no DT_SONAME, so bionic's
      # VersionTracker::init_verneed could not match the verneed entry and
      # died with `cannot find "liblitert-lm.so" from verneed[0] in DT_NEEDED
      # list`; and libc++_shared.so was missing from the package while
      # libkawai_lib.so needed its C++ runtime symbols.
      - name: Verify native dependency graph
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          READELF="$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/llvm-readelf 2>/dev/null | head -n1)"
          NM="$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/llvm-nm 2>/dev/null | head -n1)"
          SYSROOT="$(ls -d "$NDK"/toolchains/llvm/prebuilt/*/sysroot/usr/lib/aarch64-linux-android 2>/dev/null | head -n1)"
          if [ -z "$READELF" ] || [ -z "$NM" ] || [ -z "$SYSROOT" ]; then
            echo "::error::NDK llvm-readelf / llvm-nm / sysroot not found — cannot verify the native dependency graph."
            exit 1
          fi
          APK="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)"
          WORK="$(mktemp -d)"
          while IFS= read -r so; do
            unzip -p "$APK" "$so" > "$WORK/$(basename "$so")"
          done < <(unzip -Z1 "$APK" | grep -E '^lib/arm64-v8a/.*\.so$')
          soname_of() { "$READELF" -d "$1" | sed -n 's/.*(SONAME).*\[\(.*\)\]/\1/p'; }
          # Platform libraries come from the NDK sysroot. libc++ is NOT one of
          # them: the app must package its own copy (the sysroot also carries
          # libc++_shared.so, so a plain "exists in the sysroot" test would
          # wave the missing-library case straight through). Only the sysroot
          # ROOT holds static archives — the shared platform libs (liblog.so,
          # libandroid.so, …) live in per-API subdirectories, so both are
          # searched.
          is_system() {
            case "$1" in libc++*) return 1 ;; esac
            [ -f "$SYSROOT/$1" ] && return 0
            ls "$SYSROOT"/*/"$1" > /dev/null 2>&1
          }
          fail=0
          for file in "$WORK"/*.so; do
            name="$(basename "$file")"
            while IFS= read -r needed; do
              [ -n "$needed" ] || continue
              is_system "$needed" && continue
              if [ ! -f "$WORK/$needed" ]; then
                echo "::error::$name lists DT_NEEDED $needed, which is not packaged in the APK — dlopen fails at launch."
                fail=1
                continue
              fi
              dep_soname="$(soname_of "$WORK/$needed")"
              if [ "$dep_soname" != "$needed" ]; then
                echo "::error::$name needs $needed, but that library's DT_SONAME is '${dep_soname:-<none>}' — bionic resolves both DT_NEEDED and DT_VERNEED by SONAME. Link it with -Wl,-soname,$needed."
                fail=1
              fi
            done < <("$READELF" -d "$file" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
            # A version script on a dependency (litert-lm's LITERT_LM_C_API_1.0
            # node) adds a verneed entry that bionic also resolves by SONAME.
            while IFS= read -r vfile; do
              [ -n "$vfile" ] || continue
              is_system "$vfile" && continue
              if [ ! -f "$WORK/$vfile" ]; then
                echo "::error::$name has a DT_VERNEED entry for $vfile, which is not packaged in the APK."
                fail=1
                continue
              fi
              v_soname="$(soname_of "$WORK/$vfile")"
              if [ "$v_soname" != "$vfile" ]; then
                echo "::error::$name has a DT_VERNEED entry for $vfile, but that library's DT_SONAME is '${v_soname:-<none>}' — dlopen of $name fails at launch with 'cannot find \"$vfile\" from verneed[...] in DT_NEEDED list'."
                fail=1
              fi
            done < <("$READELF" -V "$file" | sed -n 's/.*File: \([^ ]*\).*/\1/p' | sort -u)
          done
          # Itanium-ABI C++ symbols (_Z…) are not provided by bionic at all:
          # they come from a libc++ runtime that the APK must package
          # (libc++_shared.so). Resolve every undefined one against the
          # packaged set; this is the check that would have caught the
          # `cannot locate symbol "_ZTISt12length_error"` launch crash.
          DEFINED="$(mktemp)"
          UNDEFINED="$(mktemp)"
          "$NM" -D --defined-only "$WORK"/*.so 2>/dev/null \
            | awk '{print $NF}' | sed 's/@.*//' | sort -u > "$DEFINED"
          "$NM" -D --undefined-only "$WORK"/*.so 2>/dev/null \
            | awk '$1 == "U" {print $NF}' | sed 's/@.*//' \
            | grep '^_Z' | sort -u > "$UNDEFINED" || true
          UNRESOLVED="$(comm -23 "$UNDEFINED" "$DEFINED")"
          if [ -n "$UNRESOLVED" ]; then
            echo "::error::Unresolved C++ runtime symbols — no packaged library defines them (libc++_shared.so missing from the APK?). dlopen fails at launch with 'cannot locate symbol \"$(echo "$UNRESOLVED" | head -n1)\"'."
            echo "$UNRESOLVED" | head -n 10
            fail=1
          fi
          [ "$fail" = 0 ] || { echo "::error::The packaged native dependency graph cannot be loaded on a device (see the messages above)."; exit 1; }
          echo "Native dependency graph resolvable: $(ls "$WORK"/*.so | wc -l) packaged libraries verified, $(wc -l < "$UNDEFINED" | tr -d ' ') C++ runtime symbols resolved."

      - name: Store native debug symbols as a run artifact
        if: ${{ steps.native_symbols.outputs.zip != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kawai-android-native-symbols-${{ inputs.variant }}-${{ inputs.tag }}
          path: ${{ steps.native_symbols.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      # R8 (release `optimization`) strips classes that are only referenced
      # from Rust via JNI by name. Two of them are load-bearing: the
      # rustls-platform-verifier Kotlin component (without it EVERY HTTPS call
      # from the app dies — "auth server unreachable: error sending request")
      # and KawaiForeground (without it a run in flight is left unprotected
      # from the cached-app freezer, which only shows up once the app is
      # backgrounded mid-generation). Fail here, before anything attaches to
      # the public release.
      - name: Verify JNI-by-name classes survived R8
        run: |
          set -euo pipefail
          APK="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)"
          TLS=0
          RUN=0
          for d in $(unzip -l "$APK" | grep -oE 'classes[0-9]*\.dex'); do
            STRINGS="$(unzip -p "$APK" "$d" | strings)"
            if grep -q 'org/rustls/platformverifier' <<<"$STRINGS"; then TLS=1; fi
            if grep -q 'pro/kawai/app/KawaiForeground' <<<"$STRINGS"; then RUN=1; fi
          done
          if [ "$TLS" != 1 ]; then
            echo "::error::org.rustls.platformverifier.CertificateVerifier was stripped by R8 — the app cannot make any HTTPS call. Check the proguard keep rules in src-tauri/gen/android/app/proguard-rules.pro."
            exit 1
          fi
          if [ "$RUN" != 1 ]; then
            echo "::error::pro.kawai.app.KawaiForeground was stripped by R8 — a run in flight loses its protection from the cached-app freezer. Check the proguard keep rules in src-tauri/gen/android/app/proguard-rules.pro."
            exit 1
          fi
          echo "rustls-platform-verifier and KawaiForeground present in the release dex."

      # ── QRIS variant: the APK is the public sideload artifact ──────────
      # The tag push starts this build before the desktop bundlers finish, so
      # the draft release may not exist yet. Create it as a DRAFT and upload
      # with `gh release upload` — that leaves draft state untouched, whereas
      # action-gh-release applies its `draft: false` default when updating an
      # existing release and would publish it with the desktop assets still
      # missing. The publish job in release.yml flips the draft once every
      # desktop platform is green.
      - name: Attach APK to the release
        if: ${{ inputs.attach_release }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          APK="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)"
          # A desktop job may create the draft concurrently — losing that race
          # is harmless (the upload needs it to exist, not to be ours).
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "kawai $TAG" || true
          gh release upload "$TAG" "$APK" --clobber

      # ── Play variant: APK artifact (manual IAP testing) ─────────────────
      # NOT attached to the public release — the public APK stays the QRIS
      # build; this APK exists so a tester can sideload the Play feature set
      # (Google Play Billing) before the internal-track rollout reaches them.
      - name: Store the IAP APK as a run artifact
        if: ${{ inputs.variant == 'play' }}
        uses: actions/upload-artifact@v4
        with:
          name: kawai-android-iap-apk-${{ inputs.tag }}
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # The AAB is the Play submission format and is NOT attached to the
      # public release (unlike the QRIS APK) — it is kept as a 30-day run
      # artifact so a manual Play upload or a re-submit of the exact same
      # bundle is possible without rebuilding. Rebuilding is NOT
      # equivalent: Play rejects a re-upload of an already-used versionCode,
      # so keeping the bytes matters.
      - name: Store the signed AAB as a run artifact
        if: ${{ inputs.build_aab }}
        uses: actions/upload-artifact@v4
        with:
          name: kawai-android-aab-${{ inputs.tag }}
          path: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          if-no-files-found: error
          retention-days: 30

      # Play's bundle upload rejects with a bare "Validation of uploaded file
      # failed." and the action swallows the API response body. Run the same
      # checks locally first (bundletool is what Play's servers run) so a
      # rejection comes back with a real, actionable message.
      - name: Validate AAB with bundletool
        if: ${{ inputs.build_aab }}
        run: |
          set -euo pipefail
          AAB="$(ls src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab | head -n1)"
          BT="$(mktemp -d)/bundletool.jar"
          URL="$(curl -fsSL https://api.github.com/repos/google/bundletool/releases/latest |
            grep -oE 'https://[^"]+bundletool[^"]*\.jar' | head -n1)"
          [ -n "$URL" ] || { echo "::error::could not resolve bundletool release jar"; exit 1; }
          curl -fsSL -o "$BT" "$URL"
          java -jar "$BT" validate --bundle "$AAB"
          echo "bundletool validation passed for $AAB"

      # Direct Play Developer API upload. Replaces r0adkll/upload-google-play:
      # v0.3.36/37 (2026-10-26) failed its resumable upload twice with a bare
      # "Validation of uploaded file failed." while the SAME AAB uploaded
      # cleanly through this simple media-upload path (verified against the
      # Play API 2026-10-27) — and the action swallowed the API's error
      # detail, making the failure undebuggable. Nothing reaches the track
      # until the final edit.commit; every failure path deletes the edit.
      # Only the play variant uploads: its feature set carries Google Play
      # Billing; the QRIS build must never reach Play (its top-up UI would
      # violate Play's digital-goods policy).
      - name: Upload AAB to Play Store (internal track)
        if: ${{ inputs.upload_play && steps.signing.outputs.signed == 'true' && vars.PLAY_UPLOAD_ENABLED == 'true' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          AAB_PATH: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          DEBUG_SYMBOLS_ZIP: ${{ steps.native_symbols.outputs.zip }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # venv, not pip --user: ubuntu-24.04 runners enforce PEP 668 and
          # refuse a bare pip install into the system interpreter.
          python3 -m venv "$RUNNER_TEMP/playenv"
          "$RUNNER_TEMP/playenv/bin/pip" install --quiet --disable-pip-version-check google-auth requests
          "$RUNNER_TEMP/playenv/bin/python" <<'PY'
          import json, os, urllib.error, urllib.request

          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          HOST = "https://androidpublisher.googleapis.com"
          PKG = "pro.kawai.app"

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          creds.refresh(Request())

          def api(method, path, data=None, ctype="application/json"):
              req = urllib.request.Request(
                  f"{HOST}{path}", data=data, method=method,
                  headers={"Authorization": f"Bearer {creds.token}",
                           "Content-Type": ctype})
              try:
                  resp = urllib.request.urlopen(req, timeout=900)
                  return resp.status, resp.read().decode()
              except urllib.error.HTTPError as e:
                  # Print the FULL API error — the reason the action is gone:
                  # its generic message hid exactly these details.
                  print(e.read().decode())
                  raise

          _, body = api("POST", f"/androidpublisher/v3/applications/{PKG}/edits", b"{}")
          edit_id = json.loads(body)["id"]
          try:
              aab = open(os.environ["AAB_PATH"], "rb").read()
              _, body = api(
                  "POST",
                  f"/upload/androidpublisher/v3/applications/{PKG}/edits/{edit_id}"
                  f"/bundles?uploadType=media",
                  aab, "application/octet-stream")
              version_code = json.loads(body)["versionCode"]
              print(f"bundle uploaded: versionCode {version_code}")

              symbols = os.environ.get("DEBUG_SYMBOLS_ZIP", "")
              if symbols and os.path.isfile(symbols):
                  try:
                      _, _body = api(
                          "POST",
                          f"/upload/androidpublisher/v3/applications/{PKG}/edits/{edit_id}"
                          f"/apks/{version_code}/deobfuscationFiles/nativeCode?uploadType=media",
                          open(symbols, "rb").read(), "application/octet-stream")
                      print("native debug symbols uploaded")
                  except urllib.error.HTTPError as e:
                      # Best-effort: the deobfuscationfiles API rejects this
                      # app's symbols zip even trimmed below the 1.6 GB
                      # guidance (v0.3.37: 2.8 GB FULL DWARF, then a 113 MB
                      # SYMBOL_TABLE variant — both "Validation of uploaded
                      # file failed.", identical under r0adkll). A diagnostic
                      # file must never block the release: warn and ship.
                      # The symbols zip stays a run artifact for a manual
                      # Play Console upload (App bundle explorer).
                      print(f"::warning::native debug symbols rejected by Play "
                            f"(HTTP {e.code}); release continues without them")
              else:
                  print("no native debug symbols to upload")

              release = {"versionCodes": [str(version_code)], "status": "completed"}
              tag = os.environ.get("RELEASE_TAG", "")
              if tag:
                  release["name"] = tag
              _, _body = api(
                  "PUT",
                  f"/androidpublisher/v3/applications/{PKG}/edits/{edit_id}/tracks/internal",
                  json.dumps({"track": "internal", "releases": [release]}).encode())
              print("track internal updated")
          except Exception:
              # Discard the partial edit; it would expire on its own anyway.
              api("DELETE", f"/androidpublisher/v3/applications/{PKG}/edits/{edit_id}")
              raise
          api("POST", f"/androidpublisher/v3/applications/{PKG}/edits/{edit_id}:commit")
          print(f"committed to the internal track: versionCode {version_code}")
          PY

      - name: Warn when the Play upload was skipped
        if: ${{ inputs.upload_play && !(steps.signing.outputs.signed == 'true' && vars.PLAY_UPLOAD_ENABLED == 'true') }}
        run: |
          echo "::warning::Play upload skipped — signed=${{ steps.signing.outputs.signed }} PLAY_UPLOAD_ENABLED=${{ vars.PLAY_UPLOAD_ENABLED }}"
          echo "The AAB stays a run artifact; upload it manually if needed."
