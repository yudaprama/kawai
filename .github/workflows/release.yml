name: release

on:
  # Gated on `ci`: this fires only after a ci run on main concludes green
  # (same workflow_run pattern as windows-smoke). The payload carries the
  # triggering run's head SHA, which the bump job checks out and inspects.
  # workflow_dispatch = manual escape hatch (e.g. re-run a failed release).
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Gate: only after `ci` finished green on a push to main. A cancelled or
    # failed ci (or a ci that came from pull_request/workflow_dispatch rather
    # than a push) never reaches the bundlers.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    outputs:
      version: ${{ steps.bump.outputs.version }}
      skipped: ${{ steps.bump.outputs.skipped || steps.guard.outputs.skipped }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the version bump commit from a previous run is
          # visible; token so we can push the bump back to main. The ref pins
          # the commit that was actually smoked (the bump is rebased onto the
          # tip of main below if main moved in the meantime).
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Recursion guard: the bot lands its bump commit with a PAT, which DOES
      # trigger `ci` again — and a green ci re-enters THIS workflow. (workflow_run has no
      # head_commit payload, so the subject is read from the checked-out
      # commit; the job-level gate above can't do this.)
      # On a bump commit the run is either the loop terminator (the release
      # for that version is already published — skip) or the ONE automatic
      # retry for a failed release run (the release is still a draft — resume
      # it: builds re-run against the tagged commit, tauri-action re-attaches
      # assets into the same draft, publish flips it). The resumed run makes
      # no commits, so no further release runs can follow — the retry chain
      # ends here regardless of its outcome.
      - name: Recursion guard (release-bot bump commit)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MSG="$(git log -1 --format=%s)"
          if [[ "$MSG" != "chore(release):"* ]]; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VER="${MSG##*v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Bump commit subject not parseable ('$MSG') — skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # gh release view resolves DRAFT releases; the releases/tags API
          # endpoint only matches published ones, so a still-draft release
          # would 404 here and the resume branch below would never fire.
          DRAFT="$(gh release view "v$VER" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$DRAFT" in
            false)
              echo "v$VER already published — loop terminator, nothing to do."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              ;;
            true)
              echo "v$VER is still a draft (its release run failed) — resuming."
              echo "resume_version=$VER" >> "$GITHUB_OUTPUT"
              echo "skipped=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "No release for v$VER (tag likely never claimed) — skipping."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Bump patch version
        id: bump
        if: steps.guard.outputs.skipped == 'false'
        run: |
          set -euo pipefail
          # ── Resume path ── the guard detected a still-draft release for the
          # version this bump commit introduced (its release run failed).
          # Re-run the builds at the EXISTING tag and republish — no new
          # commit, no new tag. The concurrency group serializes this against
          # the failed run, so there is no live race.
          if [ -n "${{ steps.guard.outputs.resume_version }}" ]; then
            VER="${{ steps.guard.outputs.resume_version }}"
            if ! git ls-remote --exit-code --tags origin "v$VER" >/dev/null 2>&1; then
              echo "Tag v$VER vanished — cannot resume."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SHA=$(git ls-remote origin "refs/tags/v$VER" "refs/tags/v$VER^{}" | tail -n1 | cut -f1)
            echo "Resuming v$VER at ${SHA:0:12} — rebuilding, then publishing the draft."
            {
              echo "version=$VER"
              echo "sha=$SHA"
              echo "skipped=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Version lives in src-tauri/tauri.conf.json; Cargo.toml picks it up
          # from there at build time (tauri reads the conf, not Cargo.toml —
          # keep Cargo.toml's 0.1.0 untouched).
          CONF=src-tauri/tauri.conf.json

          # Next version = max(conf version, newest remote tag) + 1. Taking
          # the tags into account keeps a tag-only push (race fallback) from
          # wedging the counter: if the tag got ahead of the conf, every run
          # would re-propose an existing version and skip forever.
          CONF_VER=$(python3 -c "import json;print(json.load(open('$CONF'))['version'])")
          LATEST_TAG=$(git ls-remote --tags origin 'v[0-9]*' \
            | cut -f2 | sed 's#^refs/tags/##' | grep -v '\^{}$' \
            | sed 's/^v//' | sort -V | tail -1)
          BASE=$(printf '%s\n%s\n' "$CONF_VER" "${LATEST_TAG:-0.0.0}" | sort -V | tail -1)
          NEW=$(python3 -c "major,minor,patch = '$BASE'.split('.'); print(f'{int(major)}.{int(minor)}.{int(patch)+1}')")

          if git ls-remote --exit-code --tags origin "v$NEW" >/dev/null 2>&1; then
            # Tag already claimed — a prior release run bumped+tagged but died
            # mid-build. Resume instead of skipping: the build jobs re-run
            # against the tagged commit and tauri-action re-attaches assets
            # into the existing draft release (same-name uploads clobber).
            # The workflow-level concurrency group serializes runs on this
            # ref, so this cannot be a live race with another bump.
            SHA=$(git ls-remote origin "refs/tags/v$NEW" "refs/tags/v$NEW^{}" | tail -n1 | cut -f1)
            echo "Tag v$NEW exists — resuming the interrupted release at ${SHA:0:12}."
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "kawai-release-bot"
          git config user.email "actions@github.com"
          python3 - <<EOF
          import json
          p = "$CONF"
          c = json.load(open(p))
          c["version"] = "$NEW"
          json.dump(c, open(p, "w"), indent=2)
          open(p, "a").write("\n")
          EOF
          git add "$CONF"
          git commit -m "chore(release): v$NEW"

          # Land the bump commit on main BEFORE claiming the tag, so the tag
          # always points at a commit reachable from main. On a non-FF
          # rejection (another push raced us), rebase the one-file change and
          # retry; failing that, go red loudly rather than orphaning a tag.
          if ! git push origin HEAD:main; then
            echo "Push rejected (remote moved) — rebasing the bump commit."
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

          # The bump commit is on main — now create and claim the tag.
          git tag "v$NEW"
          if ! git push origin "v$NEW"; then
            echo "Race lost on v$NEW — another run claimed the tag. Skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "version=$NEW"
            echo "sha=$(git rev-parse HEAD)"
            echo "skipped=false"
          } >> "$GITHUB_OUTPUT"

  build-macos:
    needs: bump
    if: needs.bump.outputs.skipped == 'false'
    # macos-26 (arm64, Xcode 26 default, bazel 9.2): Xcode 15.4 on macos-14
    # ships an old libc++ where __pointer_traits_element_type is a hard error
    # in SFINAE — breaks the cxx-generated contiguous_range static_assert in
    # LiteRT-LM's fc_parser_utils.cc.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The bump commit (HEAD of main) carries the new version.
          # RELEASE_TOKEN (PAT) instead of GITHUB_TOKEN so private repos work:
          # the kawai repo itself and any private submodule/cargo git dep.
          ref: ${{ needs.bump.outputs.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}

      # Authenticate ALL github.com git traffic (submodule fetches + cargo git
      # deps) with the PAT — covers private repos under yudaprama/ now or later.
      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: oven-sh/setup-bun@v2

      # tauri-action invokes the package-manager's `tauri` script; the CLI
      # binary only exists after install (node_modules/.bin/tauri).
      - name: Install JS deps
        run: bun install

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # local-llm's manifest path-deps the crates tools (finance,
      # weather_geo) — those crates compile under the litert feature, so
      # crates is required, not optional. The office feature also
      # path-deps kawai-embedding (litert embedder).
      # flutter_gemma/litert-lm-rs are NOT needed — skip them to keep the
      # checkout lean.
      - name: Init submodules (local-llm + cognee-litert-lm + crates + kawai-embedding + office_oxide + kawai-vault)
        run: git submodule update --init --recursive local-llm cognee-litert-lm crates kawai-embedding office_oxide kawai-vault rust-paddle-ocr pdf_oxide

      # ── Cached LiteRT-LM dylib set (the expensive bazel artifact) ──
      # Same key + path as ci.yml macos-smoke — repo-wide actions/cache
      # shares one entry, so the ~15-30 min bazel build only runs when the
      # engine source or its bundling moves.
      - name: LiteRT-LM dylib cache key
        id: litert-lib-key
        run: |
          set -euo pipefail
          echo "sha=$(git -C cognee-litert-lm/vendor/LiteRT-LM rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore litert-lm dylibs
        id: litert-lib
        uses: actions/cache@v4
        with:
          path: cognee-litert-lm/native
          key: litert-lib-macos26-arm64-${{ steps.litert-lib-key.outputs.sha }}-${{ hashFiles('scripts/bundle-litert-dylibs.sh') }}

      # Bazel is only needed on a dylib-cache miss — skip the multi-GB
      # restore and the build together on a hit. Mounted after the submodule
      # init so the MODULE.bazel hash in the key resolves (pre-init it
      # hashed an empty tree → constant key disjoint from ci.yml).
      # Per-runner-generation caveat: objects built against an older Xcode's
      # libc++ headers must not be reused after a toolchain jump.
      - name: Mount bazel cache
        if: steps.litert-lib.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            /private/var/tmp/_bazel_runner
          key: bazel-macos26-arm64-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/MODULE.bazel') }}
          restore-keys: bazel-macos26-arm64-

      - name: Build litert-lm dylib
        if: steps.litert-lib.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_arm64"
          cd cognee-litert-lm/vendor/LiteRT-LM
          bazel build //c:litert-lm --config=macos_arm64 --jobs=6
          mkdir -p ../../native
          cp bazel-bin/c/liblitert-lm.dylib ../../native/
          install_name_tool -id @rpath/liblitert-lm.dylib ../../native/liblitert-lm.dylib
          # Prepare the full suite of dylibs for Contents/Frameworks bundling.
          bash ../../../scripts/bundle-litert-dylibs.sh

          # Symlink target must resolve from cognee-litert-lm/ (the symlink's
          # own directory), not from the CWD where ln runs.
          ln -sfn vendor/LiteRT-LM/bazel-bin/_solib_darwin_arm64 ../../_solib_darwin_arm64

      # Office document ops (read/edit/info + creation) and PDF ops are
      # pure Rust (office_oxide, in-process) — no external engine.
      # macOS bundles ad-hoc signed (`bundle.macOS.signingIdentity: "-"` in
      # src-tauri/tauri.conf.json) — no Developer ID certificate is in the
      # release path. Do NOT add APPLE_* env vars here: unset secrets arrive as
      # EMPTY strings, and tauri prefers APPLE_SIGNING_IDENTITY over the config
      # value, so the "-" identity would be replaced by "" and notarytool would
      # run with empty credentials — red release. User-side workaround:
      # README.md "First launch".
      # The bundle must keep `bundle.macOS.entitlements`
      # (src-tauri/Entitlements.plist — com.apple.security.cs.disable-library-validation).
      # Without it, ad-hoc signing + the hardened runtime makes dyld's library
      # validation reject the prebuilt LiteRT-LM dylibs (different Team IDs) and
      # the app aborts at launch with "Library not loaded: @rpath/liblitert-lm.dylib".
      #
      # `headless-chrome` compiles the CDP-client crate into the desktop
      # bundles. It does NOT ship a browser: at runtime it resolves the user's
      # installed Chrome/Chromium (and degrades when absent). Deliberately
      # absent from the Android release set — see release-android.yml.

      - name: Build .app (with litert + office)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          # Minisign key for the updater artifacts (.sig) + latest.json —
          # passwordless key; no TAURI_SIGNING_PRIVATE_KEY_PASSWORD needed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v${{ needs.bump.outputs.version }}
          releaseName: "kawai v${{ needs.bump.outputs.version }}"
          releaseDraft: true
          prerelease: false
          # Version-less asset names: permalinks like
          # releases/latest/download/kawai_aarch64.dmg keep working across
          # releases (updater latest.json + brew cask + _redirects depend on
          # this). The input is assetNamePattern on tauri-action@v0 —
          # releaseAssetNamePattern is the v1 name and is IGNORED (warning:
          # "Unexpected input(s)"). latest.json itself is excluded by
          # tauri-action; .sig companions follow the same pattern.
          assetNamePattern: "[name]_[arch].[ext]"
          args: --features litert,tts,binance,accounting,mexc,security,headless-chrome --config .github/tauri-litert.json

      # Wallet note: the opt-in `monad` feature (Monad wallet) is deliberately
      # NOT built into release bundles — regulatory. For a local wallet build:
      #   --features litert,tts,binance,monad --config .github/tauri-monad.json

  build-linux:
    needs: bump
    if: needs.bump.outputs.skipped == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      # Tauri needs the GTK/webkit dev headers on Linux (gdk-sys et al.).
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2t64

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Init submodules (local-llm + cognee-litert-lm + crates + kawai-embedding + office_oxide + kawai-vault)
        run: git submodule update --init --recursive local-llm cognee-litert-lm crates kawai-embedding office_oxide kawai-vault rust-paddle-ocr pdf_oxide

      # Cached LiteRT-LM .so set — same key scheme as ci.yml macos-smoke
      # (platform-specific suffix), so the ~15-30 min bazel build only runs
      # when the engine source moves.
      - name: LiteRT-LM dylib cache key
        id: litert-lib-key
        run: |
          set -euo pipefail
          echo "sha=$(git -C cognee-litert-lm/vendor/LiteRT-LM rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore litert-lm shared library
        id: litert-lib
        uses: actions/cache@v4
        with:
          path: cognee-litert-lm/native
          key: litert-lib-linux24-x86_64-${{ steps.litert-lib-key.outputs.sha }}

      # Bazel is only needed on a dylib-cache miss. Mounted after the
      # submodule init so the MODULE.bazel hash in the key resolves
      # (pre-init it hashed an empty tree → constant key).
      - name: Mount bazel cache
        if: steps.litert-lib.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-linux24-x86_64-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/MODULE.bazel') }}
          restore-keys: bazel-linux24-x86_64-

      # LiteRT-LM's .bazelrc pins CC=clang (action_env). ubuntu-24.04 ships
      # clang-18 in universe — no apt.llvm.org repo needed. clang-18's std lib
      # has the std::source_location C++20 support absl requires (the older
      # runner default clang-14 lacked it).
      - name: Install clang-18
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 1000
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 1000
          clang --version

      - name: Cache linuxdeploy
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: linuxdeploy-x86_64

      - name: Download linuxdeploy
        run: |
          mkdir -p ~/.cache/tauri
          [ -f ~/.cache/tauri/linuxdeploy-x86_64.AppImage ] || \
            wget -qO ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
              https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x ~/.cache/tauri/linuxdeploy-x86_64.AppImage
          mkdir -p ~/.local/bin
          ln -sf ~/.cache/tauri/linuxdeploy-x86_64.AppImage ~/.local/bin/linuxdeploy-x86_64.AppImage
          echo "LINUXDEPLOY=$(realpath ~/.cache/tauri/linuxdeploy-x86_64.AppImage)" >> "$GITHUB_ENV"

      - name: Build litert-lm shared library
        if: steps.litert-lib.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd cognee-litert-lm/vendor/LiteRT-LM
          bazel build //c:litert-lm --config=linux_x86_64 --jobs=6
          # ../../native = cognee-litert-lm/native — the dir
          # LITERT_LM_LIB_DIR/RUSTFLAGS point at. Companion libraries are
          # loaded at engine creation (dlopen of e.g.
          # libGemmaModelConstraintProvider.so) and must sit beside the
          # main .so, both for linking and for the bundle manifest.
          mkdir -p ../../native
          cp bazel-bin/c/liblitert-lm.so ../../native/
          cp prebuilt/linux_x86_64/*.so ../../native/

      - name: Build .deb/.AppImage (with litert + office)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          # Minisign key for the updater artifacts (.sig) + latest.json —
          # passwordless key; no TAURI_SIGNING_PRIVATE_KEY_PASSWORD needed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v${{ needs.bump.outputs.version }}
          releaseName: "kawai v${{ needs.bump.outputs.version }}"
          releaseDraft: true
          prerelease: false
          # Version-less asset names — input is assetNamePattern on
          # tauri-action@v0 (see the macos job).
          assetNamePattern: "[name]_[arch].[ext]"
          args: --features litert,tts,binance,accounting,mexc,security,headless-chrome --config .github/tauri-litert.json

  build-windows:
    needs: bump
    if: needs.bump.outputs.skipped == 'false'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-windows-x86_64-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/MODULE.bazel') }}
          restore-keys: bazel-windows-x86_64-

      - name: Init submodules (local-llm + cognee-litert-lm + crates + kawai-embedding + office_oxide + kawai-vault)
        shell: bash
        run: git submodule update --init --recursive local-llm cognee-litert-lm crates kawai-embedding office_oxide kawai-vault rust-paddle-ocr pdf_oxide

      - name: Install bazelisk
        shell: pwsh
        run: |
          choco install bazelisk --confirm --no-progress

      # Upstream ml-ci-build-win recipe: the runner's TEMP is the 8.3 short
      # form (C:\Users\RUNNER~1\...); rustc's msvc link inside bazel fails
      # there (LNK1181 on .rcgu.o). Remap TMP/TEMP to a short plain path and
      # pass them through to bazel actions.
      - name: Remap TMP/TEMP for rustc/msvc linking
        shell: pwsh
        run: |
          $newTemp = "C:\_w\_tmp"
          New-Item -ItemType Directory -Path $newTemp -Force | Out-Null
          "TMP=$newTemp" >> $env:GITHUB_ENV
          "TEMP=$newTemp" >> $env:GITHUB_ENV

      - name: Build litert-lm shared library
        shell: bash
        # MSYS (Git Bash) rewrites the leading "//" of the bazel target into
        # a POSIX path ("/c:litert-lm") — invalid package name. Disable arg
        # path conversion for this step.
        # ANDROID_NDK_HOME cleared (upstream ml-ci-build-win does the same):
        # the runner's NDK makes the androidndk repo rule symlink outside its
        # directory, which fails on Windows. ANDROID_HOME stays set — with it
        # empty the androidsdk rule falls back to the workspace root and
        # fails instead. With NDK_HOME empty the androidndk toolchains never
        # register, so the repo is never fetched.
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
          ANDROID_NDK_HOME: ""
        run: |
          set -euo pipefail
          cd cognee-litert-lm/vendor/LiteRT-LM
          # Short output base avoids Windows long-path issues with MSVC linker;
          # --sandbox_writable_path lets bazel copy outputs to the short path.
          bazel --output_base=C:/_b build //c:litert-lm --config=windows \
            --jobs=4 --action_env=TMP --action_env=TEMP
          # Resolve the actual bazel-bin path (may not be the workspace symlink
          # when --output_base is overridden). Copy both the DLL (runtime) and
          # the import library (link-time) — MSVC requires .lib to link a DLL.
          BZ_BIN="$(bazel --output_base=C:/_b info bazel-bin)"
          mkdir -p ../../native
          cp "$BZ_BIN/c/litert-lm.dll" ../../native/
          # MSVC link emits the DLL's import library under bazel's interface
          # library name <target>.if.lib; rustc -llitert-lm searches for
          # litert-lm.lib — normalize the name on copy.
          if [ -f "$BZ_BIN/c/litert-lm.if.lib" ]; then
            cp "$BZ_BIN/c/litert-lm.if.lib" ../../native/litert-lm.lib
          else
            cp "$BZ_BIN/c/litert-lm.lib" ../../native/litert-lm.lib
          fi
          # Companion DLLs are load-time dependencies of litert-lm.dll (e.g.
          # libGemmaModelConstraintProvider.dll); stage them next to the main
          # DLL so runtime loading and the bundle manifest resolve them.
          cp prebuilt/windows_x86_64/*.dll ../../native/

      # ocr-rs `mnn-dynamic` was removed from src-tauri's features (see
      # b3743be); the MNN.dll download below only remains because
      # tauri.windows.conf.json still lists it under bundle.resources.
      - name: Download MNN prebuilt (dynamic) for ocr-rs mnn-dynamic
        shell: pwsh
        run: |
          $root = "C:\_mnn"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $zip = "$root\mnn-dev-windows-x86_64.zip"
          Invoke-WebRequest -Uri "https://github.com/zibo-chen/MNN-Prebuilds/releases/download/dev/mnn-dev-windows-x86_64.zip" -OutFile $zip
          Expand-Archive -Force -Path $zip -DestinationPath $root
          "MNN_LIB_DIR=C:\_mnn\mnn-dev-windows-x86_64\lib" >> $env:GITHUB_ENV
          "MNN_INCLUDE_DIR=C:\_mnn\mnn-dev-windows-x86_64\include" >> $env:GITHUB_ENV
          $native = Join-Path $env:GITHUB_WORKSPACE "cognee-litert-lm\native"
          New-Item -ItemType Directory -Path $native -Force | Out-Null
          Copy-Item "$root\mnn-dev-windows-x86_64\lib\MNN.dll" $native -Force

      - name: Build .msi/.exe (with litert + office)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          # Minisign key for the updater artifacts (.sig) + latest.json —
          # passwordless key; no TAURI_SIGNING_PRIVATE_KEY_PASSWORD needed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v${{ needs.bump.outputs.version }}
          releaseName: "kawai v${{ needs.bump.outputs.version }}"
          releaseDraft: true
          prerelease: false
          # latest.json's windows-x86_64 entry points at the NSIS setup.exe
          # (what the updater runs), not the WiX .msi.
          updaterJsonPreferNsis: true
          # Stable version-less name — input is assetNamePattern on
          # tauri-action@v0 (see the macos job).
          assetNamePattern: "[name]_[arch].[ext]"
          args: --features litert,tts,binance,accounting,mexc,security,headless-chrome --config .github/tauri-litert.json

  build-web:
    needs: bump
    if: needs.bump.outputs.skipped == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
      # No submodules needed (no litert feature), but future private cargo git
      # deps fetch through git — authenticate them too. Exception: pdf_oxide
      # is real source — the [patch] in kawai-web/src-tauri Cargo.toml
      # redirects the git dep to the vendored checkout, and web implies
      # office (→ pdf_oxide).
      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      # Cargo parses local-llm's and cognee-litert-lm's manifests even
      # without the litert feature (optional deps still resolve) — the dirs
      # must exist. local-llm path-deps crates tools, so that
      # manifest needs crates present too. Shallow, non-recursive:
      # only crate manifests, not C sources. The one exception is crates'
      # own nested submodule vendor/binance-connector-rust (binance-sdk, a
      # path dep cargo must resolve) — recurse into that single submodule.
      - name: Init submodules (local-llm + cognee-litert-lm + crates + kawai-embedding + office_oxide + kawai-vault, manifest only)
        run: |
          git submodule update --init local-llm cognee-litert-lm crates kawai-embedding office_oxide kawai-vault rust-paddle-ocr pdf_oxide
          git -C crates submodule update --init vendor/binance-connector-rust
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The kawai lib crate depends on tauri unconditionally (glib-sys et al.
      # need the GTK/webkit dev headers even when building only kawai-web).
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # office feature on: kawai-web exposes the office ops. The engines are
      # NOT bundled — deploy them as siblings of the binary (or set
      # KAWAI_OFFICE_BIN_DIR / KAWAI_OFFICE_RUNTIME_DIR); without them
      # office_capabilities reports them absent and the agent degrades.
      - name: Build kawai-web binary
        run: cargo build --release --bin kawai-web --features web,tts
        working-directory: src-tauri
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          draft: true
          files: src-tauri/target/release/kawai-web

  # Auto-publish: flip the draft to a published release marked "latest" only
  # after EVERY platform build finished green — needs: is the gate. A failed
  # platform build skips this job and leaves the draft (with the assets that
  # did land) for manual completion/resume — same fallback as before.
  # tauri-action's publishDraft can't do this: each platform job would publish
  # the release the moment IT finishes, with the other platforms' assets still
  # missing. Idempotent on an already-published release (resume re-runs).
  publish:
    needs: [bump, build-macos, build-linux, build-windows, build-web]
    if: needs.bump.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish draft release as latest
        env:
          # RELEASE_TOKEN (PAT), NOT GITHUB_TOKEN: the flip stays attributed to
          # the release bot's identity, and any future `release`-event consumer
          # keeps working (GITHUB_TOKEN-created events never trigger
          # workflows). release-android does NOT depend on this event — it
          # starts from the tag push the bump job makes.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # No checkout in this job — gh discovers the repo via git remote by
          # default and dies with "not a git repository". GH_REPO skips that.
          GH_REPO: ${{ github.repository }}
        run: |
          # Transient gh/API failures get 3 attempts before the release run
          # goes red — a red run here still self-heals via the guard's resume
          # path, but a 2-minute retry beats a 1-2 hour rebuild.
          for ATTEMPT in 1 2 3; do
            if gh release edit "v${{ needs.bump.outputs.version }}" --draft=false --latest; then
              exit 0
            fi
            echo "Attempt $ATTEMPT failed — retrying in 60s."
            sleep 60
          done
          exit 1
