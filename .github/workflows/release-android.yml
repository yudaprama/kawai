name: release-android

# Android release — deliberately a SEPARATE workflow from release.yml
# (desktop). Mobile and desktop have independent lifecycles: a broken
# Android build must never block, delay or fail the desktop release, and
# the Play Console rollout is not gated on desktop being green.
#
# Trigger: a `v*` TAG PUSH. release.yml's bump job claims the tag with
# RELEASE_TOKEN (a PAT), and PAT-created events DO trigger workflows
# (GITHUB_TOKEN ones never do). The tag appears ~1 minute into the release
# run, so this build runs IN PARALLEL with the desktop bundlers instead of
# waiting for the published release — no `release: published` hop, no
# serialization behind macOS/Windows/Linux. Exactly one run per tag: the
# bump job is the only writer of `v*` tags, and release.yml's re-entry/skip
# paths never re-create one.
#
# Desktop publish is NOT gated on this workflow (release.yml's
# `publish.needs` excludes it), so a slow or failed Android build can never
# hold the release back; in that case the APK lands on the already-published
# release afterwards. workflow_dispatch(tag) re-runs it for one tag (failed
# upload, new internal rollout).
#
# TWO VARIANTS per tag, built by ./.github/workflows/release-android-build.yml
# in parallel:
#   • QRIS APK  — features `release-android`, attached to the GitHub release.
#     Direct-distribution top-up via QRIS (worker `/topup/qris/*`).
#   • Play AAB  — features `release-android-play` (= release-android + `iap`),
#     uploaded to the Play internal track when PLAY_UPLOAD_ENABLED=true.
#     Google Play Billing top-up (tauri-plugin-iap, purchases verified +
#     credited by the worker `/topup/iap/*`). Play's digital-goods policy
#     requires purchases through Play Billing, so this build hides the QRIS +
#     voucher UI (`topup_iap_available` gates the frontend branch) and must
#     never reach Play from the QRIS variant.
# Both variants share the applicationId + upload keystore, so a device can
# move between channels by plain install-over (same signatures).
#
# versionCode = 10000 + the PARENT run_number (monotonic per repo, one code
# per release run): only the play variant's uploads consume Play codes — the
# QRIS APK never touches Play.
#
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#          ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS, PLAY_SERVICE_ACCOUNT_JSON
#          (Play upload AND — the same service account — the worker's
#          `/topup/iap/*` purchase verification; see CREDENTIALS.md)
# Variables: PLAY_UPLOAD_ENABLED ("true" enables the Play upload)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rebuild (e.g. v0.3.9). Required for workflow_dispatch.'
        required: false
        type: string
      loki_level:
        description: 'KAWAI_LOKI_LEVEL baked at compile time (off|error|warn|info|debug|trace). info makes a device session observable from Grafana alone.'
        required: false
        type: string
        default: 'warn'

permissions:
  contents: write

# Serialize per tag: two runs uploading the same versionCode would race
# on Play's "versionCode already used".
concurrency:
  group: release-android-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # GitHub Actions expressions have no arithmetic operators, so
  # `10000 + github.run_number` cannot be written inline. Compute it in a
  # shell step and expose the result as an output for both variant jobs.
  version-code:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.compute.outputs.value }}
    steps:
      - id: compute
        run: echo "value=$((10000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"


  # LiteRT-LM is identical for the QRIS and Play feature sets. Build its
  # arm64 shared object once, then give both isolated variant runners the
  # same linker input. A cache cannot reliably deduplicate concurrent cold
  # jobs because it is saved only when its writer completes.
  prepare-native:
    needs: version-code
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          token: ${{ secrets.RELEASE_TOKEN }}
          submodules: recursive
          lfs: true

      - uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Install Android NDK
        run: |
          set -euo pipefail
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/latest*/bin/sdkmanager | sort -V | tail -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-linux-android_arm64-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/WORKSPACE', 'cognee-litert-lm/vendor/LiteRT-LM/.bazelrc') }}
          restore-keys: bazel-linux-android_arm64-

      - name: Install bazelisk
        run: |
          sudo wget -q --tries=10 --timeout=30 --waitretry=5 -O /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazelisk

      - name: Build LiteRT-LM for Android (arm64)
        run: |
          set -euo pipefail
          cd cognee-litert-lm/vendor/LiteRT-LM
          bazelisk build //c:litert-lm --config=android_arm64 --jobs=6 \
            --linkopt=-Wl,-soname,liblitert-lm.so \
            --linkopt=-Wl,-z,max-page-size=16384
          mkdir -p ../../native/aarch64-linux-android
          cp bazel-bin/c/liblitert-lm.so ../../native/aarch64-linux-android/

      - name: Upload LiteRT-LM linker input
        uses: actions/upload-artifact@v4
        with:
          name: litert-android-native
          path: cognee-litert-lm/native/aarch64-linux-android/liblitert-lm.so
          if-no-files-found: error
          retention-days: 1

  build-qris:
    needs: [version-code, prepare-native]
    uses: ./.github/workflows/release-android-build.yml
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      version_code: ${{ needs.version-code.outputs.value }}
      variant: qris
      features: release-android
      build_aab: false
      build_apk: true
      attach_release: true
      upload_play: false
      loki_level: ${{ inputs.loki_level || 'warn' }}
      native_artifact: litert-android-native
    secrets: inherit

  build-play:
    needs: [version-code, prepare-native]
    uses: ./.github/workflows/release-android-build.yml
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      version_code: ${{ needs.version-code.outputs.value }}
      variant: play
      features: release-android-play
      build_aab: true
      build_apk: true
      attach_release: false
      upload_play: true
      loki_level: ${{ inputs.loki_level || 'warn' }}
      native_artifact: litert-android-native
    secrets: inherit
