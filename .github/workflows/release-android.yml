name: release-android

# Android release — deliberately a SEPARATE workflow from release.yml
# (desktop). Mobile and desktop have independent lifecycles: a broken
# Android build must never block, delay or fail the desktop release, and
# the Play Console rollout is not gated on desktop being green.
#
# Trigger: a `v*` TAG PUSH. release.yml's bump job claims the tag with
# RELEASE_TOKEN (a PAT), and PAT-created events DO trigger workflows
# (GITHUB_TOKEN ones never do). The tag appears ~1 minute into the release
# run, so this build runs IN PARALLEL with the desktop bundlers instead of
# waiting for the published release — no `release: published` hop, no
# serialization behind macOS/Windows/Linux. Exactly one run per tag: the
# bump job is the only writer of `v*` tags, and release.yml's re-entry/skip
# paths never re-create one.
#
# Desktop publish is NOT gated on this workflow (release.yml's
# `publish.needs` excludes it), so a slow or failed Android build can never
# hold the release back; in that case the APK lands on the already-published
# release afterwards. The draft is created below when the desktop jobs
# haven't created it yet, so normally the APK is in place before publish
# flips the draft. The AAB is unaffected either way (run artifact + Play).
# workflow_dispatch(tag) re-runs it for one tag (failed upload, new internal
# rollout).
#
# Feature set: SAME as the desktop release — default `desktop` (office, graph,
# mexc) + litert, tts, binance, accounting. `litert` is why this builds
# aarch64 ONLY: the LiteRT-LM C library is built for android_arm64
# (`bazel build //c:litert-lm --config=android_arm64`, staged into jniLibs by
# scripts/stage-litert-android.sh) and armeabi-v7a can neither link it nor fit
# a GB-scale model in a 32-bit address space. Every Android phone that can run
# API 24+ from the last decade is arm64-capable; Play requires 64-bit anyway.
#
# On-device inference also needs a `.litertlm` model file in <app_data>/models
# — no model ships inside the APK (same as the desktop bundles).
#
# Targets: aarch64 only. x86/x86_64 are emulator-only — they double the Rust
# compile time and Play does not require them.
#
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#          ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS, PLAY_SERVICE_ACCOUNT_JSON
# Variables: PLAY_UPLOAD_ENABLED ("true" enables the Play upload)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rebuild (e.g. v0.3.9). Required for workflow_dispatch.'
        required: false
        type: string
      loki_level:
        description: 'KAWAI_LOKI_LEVEL baked at compile time (off|error|warn|info|debug|trace). info makes a device session observable from Grafana alone.'
        required: false
        type: string
        default: 'warn'

permissions:
  contents: write

# Serialize per tag: two runs uploading the same versionCode would race
# on Play's "versionCode already used".
concurrency:
  group: release-android-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve tag
        id: tag
        env:
          # The tag push carries the tag in ref_name; a dispatch may override
          # it with the input (dispatch on a branch ref must set the input).
          PUSH_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG=""
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "${PUSH_TAG:-}" ]; then
            TAG="$PUSH_TAG"
          fi
          if [ -z "$TAG" ]; then
            echo "No tag to build — workflow_dispatch requires the tag input." >&2
            exit 1
          fi
          # versionName is what users see; the versionCode below carries the
          # strictly-monotonic part Play requires.
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not vMAJOR.MINOR.PATCH — cannot set versionName." >&2
            exit 1
          fi
          echo "Building Android for $TAG (versionName $VERSION)."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          token: ${{ secrets.RELEASE_TOKEN }}
          # Private submodules (office_oxide, pdf_oxide, kawai-vault, …) are
          # path/git dependencies of src-tauri's default `desktop` feature —
          # the release token above authenticates the fetches.
          submodules: recursive

      - name: Git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The runner's preinstalled cmdline-tools (16.0) cannot parse the
          # SDK XML v4 repository, so minor-versioned platforms like
          # 'platforms;android-37.0' are invisible to it. Install
          # cmdline-tools;latest first (old-format package, always
          # resolvable), then install the rest with the new sdkmanager.
          packages: 'cmdline-tools;latest'

      - name: Install SDK packages (API 37.0, build-tools 37, NDK 28)
        run: |
          set -euo pipefail
          # A preinstalled cmdline-tools;latest makes the action install the
          # new one as 'latest-2' — always pick the newest by version sort.
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/latest*/bin/sdkmanager | sort -V | tail -n1)"
          # compileSdk/targetSdk 37 + NDK 28 match src-tauri/gen/android.
          # API 37's platform package is 'android-37.0' (minor-versioned
          # naming); 'platforms;android-37' does not exist. NDK 28.0.13004158
          # was never published — 28.2.13676358 is the newest stable 28.x.
          # One package per argument; 'yes || true' because closing the pipe
          # SIGPIPEs it once licenses are all accepted.
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"
          # The LiteRT-LM bazel build (androidndk rule) and cognee-litert-lm's
          # build.rs both resolve the NDK from ANDROID_NDK_HOME.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── LiteRT-LM C library (android_arm64) ─────────────────────────────
      # Same bazel source as the desktop release, different config. Bazelisk
      # honors the vendored .bazelversion pin so this matches upstream.
      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-linux-android_arm64-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/MODULE.bazel') }}
          restore-keys: bazel-linux-android_arm64-

      - name: Install bazelisk
        run: |
          sudo wget -qO /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazelisk
          bazelisk version

      # The .so and its companions land in native/aarch64-linux-android — the
      # link dir cognee-litert-lm's build.rs infers for this target — and are
      # then packed into jniLibs so the Android linker resolves them from the
      # app's nativeLibraryDir at load time (both the link and the runtime half
      # of the litert feature).
      - name: Build litert-lm for Android (arm64)
        run: |
          set -euo pipefail
          cd cognee-litert-lm/vendor/LiteRT-LM
          bazelisk build //c:litert-lm --config=android_arm64 --jobs=6
          mkdir -p ../../native/aarch64-linux-android
          cp bazel-bin/c/liblitert-lm.so ../../native/aarch64-linux-android/
          cp prebuilt/android_arm64/*.so ../../native/aarch64-linux-android/

      - name: Stage litert libs into jniLibs
        run: bash scripts/stage-litert-android.sh

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret set — release falls back to the debug key (not uploadable to Play)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          # The upload keystore is PKCS12 (kawai-android-upload.p12, alias
          # `upload`): the format has no separate key password — Java derives
          # it from the store password. ANDROID_KEY_PASSWORD is ignored here;
          # passing it as keyPassword makes gradle fail key decryption
          # ("Given final block not properly padded") whenever it differs.
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$STORE_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Play rejects an upload whose versionCode was already used, so it
      # must strictly increase per app — run_number is monotonic per repo
      # and independent of the desktop version bump (which can be resumed
      # and re-run at the same tag).
      - name: Set Android version
        run: |
          cat > src-tauri/gen/android/app/tauri.properties <<EOF
          tauri.android.versionCode=$(( 10000 + ${{ github.run_number }} ))
          tauri.android.versionName=${{ steps.tag.outputs.version }}
          EOF

      - name: Build signed AAB
        env:
          # Read at compile time (option_env!) — this is how a release APK
          # under test opts into INFO; a phone has no shell to export into.
          KAWAI_LOKI_LEVEL: ${{ inputs.loki_level || 'warn' }}
        run: bun tauri android build --target aarch64 --features litert,tts,binance,accounting,mexc

      - name: Build universal APK (sideload)
        env:
          KAWAI_LOKI_LEVEL: ${{ inputs.loki_level || 'warn' }}
        run: bun tauri android build --target aarch64 --features litert,tts,binance,accounting,mexc --apk

      # R8 (release `optimization`) strips classes that are only referenced
      # from Rust via JNI by name — the rustls-platform-verifier Kotlin
      # component is one of them, and without it EVERY HTTPS call from the
      # app dies ("auth server unreachable: error sending request") while
      # debug builds work fine. Fail here, before anything attaches to the
      # public release.
      - name: Verify TLS verifier survived R8
        run: |
          set -euo pipefail
          APK="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)"
          HIT=0
          for d in $(unzip -l "$APK" | grep -oE 'classes[0-9]*\.dex'); do
            if unzip -p "$APK" "$d" | strings | grep -q 'org/rustls/platformverifier'; then
              HIT=1
            fi
          done
          if [ "$HIT" != 1 ]; then
            echo "::error::org.rustls.platformverifier.CertificateVerifier was stripped by R8 — the app cannot make any HTTPS call. Check the proguard keep rules in src-tauri/gen/android/app/proguard-rules.pro."
            exit 1
          fi
          echo "rustls-platform-verifier present in the release dex."

      # The tag push starts this build before the desktop bundlers finish, so
      # the draft release may not exist yet. Create it as a DRAFT and upload
      # with `gh release upload` — that leaves draft state untouched, whereas
      # action-gh-release applies its `draft: false` default when updating an
      # existing release and would publish it with the desktop assets still
      # missing. The publish job in release.yml flips the draft once every
      # desktop platform is green.
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          APK="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)"
          # A desktop job may create the draft concurrently — losing that race
          # is harmless (the upload needs it to exist, not to be ours).
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "kawai $TAG" || true
          gh release upload "$TAG" "$APK" --clobber

      # The AAB is the Play submission format and is NOT attached to the
      # public release (unlike the APK) — it is kept as a 30-day run
      # artifact so a manual Play upload or a re-submit of the exact same
      # bundle is possible without rebuilding. Rebuilding is NOT
      # equivalent: Play rejects a re-upload of an already-used versionCode,
      # so keeping the bytes matters.
      - name: Store the signed AAB as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: kawai-android-aab-${{ steps.tag.outputs.tag }}
          path: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB to Play Store (internal track)
        if: ${{ steps.signing.outputs.signed == 'true' && vars.PLAY_UPLOAD_ENABLED == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pro.kawai.app
          releaseFiles: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          track: internal
          status: completed

      - name: Warn when the upload was skipped
        if: ${{ !(steps.signing.outputs.signed == 'true' && vars.PLAY_UPLOAD_ENABLED == 'true') }}
        run: |
          echo "::warning::Play upload skipped — signed=${{ steps.signing.outputs.signed }} PLAY_UPLOAD_ENABLED=${{ vars.PLAY_UPLOAD_ENABLED }}"
          echo "Artifacts are attached to the GitHub release; upload the AAB manually if needed."