name: windows-smoke

# Windows is a deliberately isolated smoke gate. Its cold MSVC + LiteRT build
# can take several hours, so push-triggered cancel-in-progress would repeatedly
# kill it before rust-cache could become useful.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Windows full gate: bazel-built litert-lm + unit tests + all smokes.
  windows-smoke:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    # Cold MSVC + LiteRT compilation exceeded the old 210-minute ceiling.
    # This workflow is deliberately not in the push CI concurrency group.
    timeout-minutes: 360
    env:
      # Keep Windows PDB/debug output out of the cold compile and rust cache.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git auth for private dependencies
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Preserve the target directory when a non-timeout failure occurs;
          # the dedicated workflow avoids cancelling this long job mid-compile.
          cache-on-failure: true

      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            C:\_b
          key: bazel-windows-x86_64-${{ hashFiles('cognee-litert-lm/vendor/LiteRT-LM/MODULE.bazel') }}
          restore-keys: bazel-windows-x86_64-

      - name: Init submodules (local-llm + cognee-litert-lm + crates + kawai-embedding + office_oxide + kawai-vault)
        shell: bash
        run: git submodule update --init --recursive local-llm cognee-litert-lm crates kawai-embedding office_oxide kawai-vault rust-paddle-ocr whatlang-rs

      - name: Install bazelisk
        shell: pwsh
        run: choco install bazelisk --confirm --no-progress

      # Upstream ml-ci-build-win recipe: the runner's TEMP is the 8.3 short
      # form — rustc's msvc link inside bazel fails there (LNK1181 on .rcgu.o).
      - name: Remap TMP/TEMP for rustc/msvc linking
        shell: pwsh
        run: |
          $newTemp = "C:\_w\_tmp"
          New-Item -ItemType Directory -Path $newTemp -Force | Out-Null
          "TMP=$newTemp" >> $env:GITHUB_ENV
          "TEMP=$newTemp" >> $env:GITHUB_ENV

      - name: Build litert-lm shared library
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
          ANDROID_NDK_HOME: ""
        run: |
          set -euo pipefail
          cd cognee-litert-lm/vendor/LiteRT-LM
          bazel --output_base=C:/_b build //c:litert-lm --config=windows \
            --jobs=4 --action_env=TMP --action_env=TEMP
          BZ_BIN="$(bazel --output_base=C:/_b info bazel-bin)"
          mkdir -p ../../native
          cp "$BZ_BIN/c/litert-lm.dll" ../../native/
          # MSVC link emits the DLL's import library under bazel's interface
          # library name <target>.if.lib; rustc -llitert-lm searches for
          # litert-lm.lib — normalize the name on copy.
          if [ -f "$BZ_BIN/c/litert-lm.if.lib" ]; then
            cp "$BZ_BIN/c/litert-lm.if.lib" ../../native/litert-lm.lib
          else
            cp "$BZ_BIN/c/litert-lm.lib" ../../native/litert-lm.lib
          fi
          # Companion DLLs are load-time dependencies of litert-lm.dll (e.g.
          # libGemmaModelConstraintProvider.dll); stage them next to the main
          # DLL so PATH-based loading resolves them.
          cp prebuilt/windows_x86_64/*.dll ../../native/

      # Expose the staged DLLs to the test/smoke binaries WITHOUT clobbering
      # PATH: a step-env `PATH:` override replaces the runner PATH entirely
      # (`${{ env.PATH }}` is empty in workflow-file context, which erases
      # cargo). GITHUB_PATH appends persist and merge with the runner PATH.
      - name: Add native dir to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ github.workspace }}\cognee-litert-lm\native"

      # ── Unit tests ──
      - name: cargo test (litert + office)
        working-directory: src-tauri
        shell: bash
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo test --features litert --lib

      - name: cargo test (local-llm; generation gate + queue)
        working-directory: local-llm
        shell: bash
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
        run: cargo test --lib

      # ── Smoke 1: on-device streaming ──
      - name: Cache smoke model fixture
        id: model
        uses: actions/cache@v4
        with:
          path: smoke-model
          key: lfm25-1p2b-instruct-int8-litertlm

      - name: Download smoke model fixture
        if: steps.model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p smoke-model
          curl -fL --retry 3 -o smoke-model/lfm2.5-1.2b-instruct-int8.litertlm \
            https://huggingface.co/litert-community/LFM2.5-1.2B-Instruct/resolve/main/LFM2.5-1.2B-Instruct_int8.litertlm

      - name: local_llm_smoke (on-device streaming regression)
        working-directory: src-tauri
        shell: bash
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        # $GITHUB_WORKSPACE, not the ${{ github.workspace }} expression: the
        # expression is inlined into the bash script as D:\a\kawai\kawai and,
        # unquoted, bash eats the backslashes as escapes (\a → a) → the model
        # path arrives mangled. Runtime env expansion keeps them intact.
        run: cargo run --example local_llm_smoke --features litert -- "$GITHUB_WORKSPACE/smoke-model/lfm2.5-1.2b-instruct-int8.litertlm"

      # ── Smoke 2 + 3: hybrid cloud tier ──
      - name: remote_smoke (cloud streaming + usage)
        working-directory: src-tauri
        shell: bash
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo run --example remote_smoke --features litert

      - name: draft_smoke (cloud → docx artifact + receipt)
        working-directory: src-tauri
        shell: bash
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
        run: cargo run --example draft_smoke --features litert

      # ── Smoke 4 (Windows): keyless Binance market data + TA ──
      - name: binance_smoke (keyless market data + TA)
        working-directory: src-tauri
        env:
          KAWAI_BINANCE_REST_BASE: https://data-api.binance.vision
        shell: bash
        run: cargo run --example binance_smoke --features binance

      # ── Smoke (offline): analytics agent tools — csv + the xlsx bridge
      #    (typed conversion, sidecar cache) through the office store, on
      #    every OS. No network, no model.
      - name: analytics_smoke (data_schema/data_query + xlsx bridge)
        run: cargo run --example analytics_smoke
        working-directory: src-tauri

      # ── Smoke 5: orchestration-quality gate ──
      # Download directly instead of consuming the repository-wide Actions
      # cache budget. The 4.8 GB E4B cache prevented rust target caches from
      # surviving alongside the two platform bazel caches.
      - name: Download E4B eval model
        shell: bash
        run: |
          mkdir -p eval-model
          curl -fL --retry 3 -o eval-model/gemma-4-E4B-it.litertlm \
            https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm

      - name: agent_eval (orchestration quality gate + report)
        working-directory: src-tauri
        shell: bash
        env:
          LITERT_LM_LIB_DIR: ${{ github.workspace }}/cognee-litert-lm/native
          LLVM_PROFILE_FILE: /dev/null
          KAWAI_LLM_MAX_TOKENS: "8192"
          EVAL_MIN_PASS: "19"
        run: |
          cargo run --release --example agent_eval --features litert -- \
            "$GITHUB_WORKSPACE/eval-model/gemma-4-E4B-it.litertlm" \
            "$GITHUB_WORKSPACE/agent-eval-report-windows.md"
          cat "$GITHUB_WORKSPACE/agent-eval-report-windows.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-windows
          path: agent-eval-report-windows.md
          if-no-files-found: warn
