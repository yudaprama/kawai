[package]
name = "kawai-tools"
version = "0.1.0"
edition = "2024"
description = "The kawai agent tool seam: typed AgentTool trait + name-keyed ToolSet registry with JSON-args dispatch"
license = "MIT"
publish = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `macros` only — the deadline module's task_local (shared step deadline read
# by every internal-loop tool; the supervisor attaches it via `scope`).
tokio = { version = "1", default-features = false, features = ["macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "2"
