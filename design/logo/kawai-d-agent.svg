<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Concept D v2: kawaii agent — twin-tails, polished flat vector -->
  <rect width="512" height="512" rx="115" fill="#14121A"/>
  <!-- twin tails: short bobs outside the face, gap visible against the tile -->
  <rect x="84" y="252" width="54" height="122" rx="27" fill="#FF6B9D" transform="rotate(14 111 313)"/>
  <rect x="374" y="252" width="54" height="122" rx="27" fill="#FF6B9D" transform="rotate(-14 401 313)"/>
  <!-- ahoge -->
  <path d="M 244 118 C 236 92, 254 78, 270 90 C 282 99, 276 114, 262 116"
        stroke="#FF6B9D" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- face -->
  <circle cx="256" cy="274" r="112" fill="#F5EDE6"/>
  <!-- hair: dome + parted fringe -->
  <path d="M 140 300
           C 138 190, 190 122, 256 122
           C 322 122, 374 190, 372 300
           C 358 248, 334 230, 308 240
           C 290 247, 268 254, 256 254
           C 244 254, 222 247, 204 240
           C 178 230, 154 248, 140 300 Z" fill="#FF6B9D"/>
  <!-- hair sheen -->
  <ellipse cx="256" cy="160" rx="62" ry="18" fill="#FF8FB4" opacity="0.6" transform="rotate(-3 256 160)"/>
  <!-- face -->
  <ellipse cx="210" cy="286" rx="14" ry="18" fill="#2A2433"/>
  <ellipse cx="302" cy="286" rx="14" ry="18" fill="#2A2433"/>
  <circle cx="216" cy="278" r="5" fill="#F5EDE6"/>
  <circle cx="308" cy="278" r="5" fill="#F5EDE6"/>
  <ellipse cx="172" cy="318" rx="20" ry="12" fill="#FFB3C8"/>
  <ellipse cx="340" cy="318" rx="20" ry="12" fill="#FFB3C8"/>
  <path d="M 244 322 Q 256 334 268 322" stroke="#2A2433" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>
